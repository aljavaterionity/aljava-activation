<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Analytics - ALJAVA TERIONITY</title><style>body{margin:0;font-family:Inter,Poppins,Arial,sans-serif;background:#010713;color:#fff;padding:24px}.wrap{max-width:1100px;margin:auto}.card{border:1px solid rgba(55,210,255,.35);border-radius:20px;background:rgba(4,25,72,.85);padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.box{padding:18px;border:1px solid rgba(55,210,255,.2);border-radius:14px}.label{color:#9db7cc;font-size:12px}.num{font-size:26px;font-weight:900;color:#35e7ff;margin-top:8px}input,button{padding:11px;border-radius:10px;border:1px solid rgba(55,210,255,.35);background:#031b46;color:#fff}button{cursor:pointer;font-weight:800}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid rgba(100,150,200,.15);font-size:12px}th{color:#bfefff}a{color:#35e7ff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><h1>Card Analytics</h1><p style="color:#9db7cc">Monitor scan/tap berdasarkan ID kartu.</p><div class="card"><input id="cardId" placeholder="Masukkan ID kartu" style="width:65%"><button id="load">Tampilkan</button></div><div class="grid"><div class="box"><div class="label">Total Aktivitas</div><div class="num" id="total">0</div></div><div class="box"><div class="label">Scan</div><div class="num" id="scan">0</div></div><div class="box"><div class="label">Tap</div><div class="num" id="tap">0</div></div><div class="box"><div class="label">Aktivitas Terakhir</div><div class="num" id="last" style="font-size:15px">-</div></div></div><div class="card"><h2>History</h2><div id="content">Masukkan ID kartu untuk melihat history.</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/app-config.js"></script><script src="/assets/business-context.js"></script><script>(async()=>{'use strict';const sb=window.__ALJAVA_SUPABASE_CLIENT,$=id=>document.getElementById(id),esc=v=>String(v??'-').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));let activeUnit=null;function show(t){$('content').textContent=t}async function auth(){const {data,error}=await sb.auth.getUser();if(error||!data.user){location.href='/login.html';return false}return true}async function load(){const id=$('cardId').value.trim();if(!id)return;if(!activeUnit){show('Unit bisnis aktif belum tersedia.');return}show('Memuat history...');try{const {data:card,error:cardError}=await sb.from('Cards').select('id,card_id,card_code,business_unit_id').eq('business_unit_id',activeUnit.id).or(`id.eq.${id},card_id.eq.${id},card_code.eq.${id}`).maybeSingle();if(cardError)throw cardError;if(!card){show('Kartu tidak ditemukan pada unit bisnis aktif.');return}const {data:rows,error}=await sb.from('CardScans').select('id,card_id,event_type,scanned_at,created_at').eq('business_unit_id',activeUnit.id).eq('card_id',card.card_id).order('created_at',{ascending:false});if(error)throw error;const list=rows||[];const scan=list.filter(x=>String(x.event_type||'scan').toLowerCase()==='scan').length,tap=list.filter(x=>String(x.event_type||'').toLowerCase()==='tap').length;$('total').textContent=list.length;$('scan').textContent=scan;$('tap').textContent=tap;$('last').textContent=list[0]?new Date(list[0].scanned_at||list[0].created_at).toLocaleString('id-ID'):'-';$('content').innerHTML=list.length?'<table><thead><tr><th>Waktu</th><th>ID Kartu</th><th>Jenis</th></tr></thead><tbody>'+list.map(x=>'<tr><td>'+esc(new Date(x.scanned_at||x.created_at).toLocaleString('id-ID'))+'</td><td>'+esc(x.card_id)+'</td><td>'+esc(x.event_type||'scan')+'</td></tr>').join('')+'</tbody></table>':'Belum ada aktivitas untuk kartu ini.'}catch(e){show('Gagal memuat: '+e.message)}}async function init(){const ctx=await window.ALJAVA_BUSINESS_CONTEXT.load();activeUnit=ctx.active||null;if(!activeUnit){show('Akun ini belum memiliki akses ke unit bisnis.');return}const q=new URLSearchParams(location.search).get('card_id');if(q){$('cardId').value=q;await load()}}$('load').onclick=load;window.addEventListener('aljava:business-changed',e=>{activeUnit=e.detail?.businessUnit||null;$('total').textContent='0';$('scan').textContent='0';$('tap').textContent='0';$('last').textContent='-';if($('cardId').value.trim())load()});if(await auth())init().catch(e=>show('Gagal memuat: '+e.message));})();</script></body></html>
