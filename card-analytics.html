<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Analytics - ALJAVA TERIONITY</title><style>body{margin:0;font-family:Inter,Poppins,Arial,sans-serif;background:#010713;color:#fff;padding:24px}.wrap{max-width:1100px;margin:auto}.card{border:1px solid rgba(55,210,255,.35);border-radius:20px;background:rgba(4,25,72,.85);padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.box{padding:18px;border:1px solid rgba(55,210,255,.2);border-radius:14px}.label{color:#9db7cc;font-size:12px}.num{font-size:26px;font-weight:900;color:#35e7ff;margin-top:8px}input,button{padding:11px;border-radius:10px;border:1px solid rgba(55,210,255,.35);background:#031b46;color:#fff}button{cursor:pointer;font-weight:800}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid rgba(100,150,200,.15);font-size:12px}th{color:#bfefff}a{color:#35e7ff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><h1>Card Analytics</h1><p style="color:#9db7cc">Monitor scan/tap berdasarkan ID kartu.</p><div class="card"><input id="cardId" placeholder="Masukkan ID kartu" style="width:65%"><button id="load">Tampilkan</button></div><div class="grid"><div class="box"><div class="label">Total Aktivitas</div><div class="num" id="total">0</div></div><div class="box"><div class="label">Scan</div><div class="num" id="scan">0</div></div><div class="box"><div class="label">Tap</div><div class="num" id="tap">0</div></div><div class="box"><div class="label">Aktivitas Terakhir</div><div class="num" id="last" style="font-size:15px">-</div></div></div><div class="card"><h2>History</h2><div id="content">Masukkan ID kartu untuk melihat history.</div></div></main><script>const URL='https://lbzwmcxwxummitldxucj.supabase.co',KEY='sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw';let token=localStorage.getItem('supabase_access_token')||'';const esc=v=>String(v??'-').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const id=document.getElementById('cardId').value.trim();if(!id)return;const r=await fetch(URL+'/rest/v1/CardScans?select=id,card_id,event_type,scanned_at,created_at&card_id=eq.'+encodeURIComponent(id)+'&order=created_at.desc',{headers:{apikey:KEY,Authorization:'Bearer '+token}});const rows=await r.json();if(!r.ok){document.getElementById('content').textContent=rows.message||'Gagal memuat';return}const scan=rows.filter(x=>String(x.event_type||'scan').toLowerCase()==='scan').length,tap=rows.filter(x=>String(x.event_type||'').toLowerCase()==='tap').length;document.getElementById('total').textContent=rows.length;document.getElementById('scan').textContent=scan;document.getElementById('tap').textContent=tap;document.getElementById('last').textContent=rows[0]?new Date(rows[0].scanned_at||rows[0].created_at).toLocaleString('id-ID'):'-';document.getElementById('content').innerHTML=rows.length?'<table><thead><tr><th>Waktu</th><th>ID Kartu</th><th>Jenis</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(new Date(x.scanned_at||x.created_at).toLocaleString('id-ID'))+'</td><td>'+esc(x.card_id)+'</td><td>'+esc(x.event_type||'scan')+'</td></tr>').join('')+'</tbody></table>':'Belum ada aktivitas untuk kartu ini.'}document.getElementById('load').onclick=load;const q=new URLSearchParams(location.search).get('card_id');if(q){document.getElementById('cardId').value=q;load()}</script></body></html>
