name: Admin Menu Emergency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[admin-menu-emergency]') && !contains(github.event.head_commit.message, '[admin-menu-v4]') && !contains(github.event.head_commit.message, '[admin-menu-final-fix]') && !contains(github.event.head_commit.message, '[admin-menu-layout-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install emergency independent menu
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker='ALJAVA ADMIN MENU EMERGENCY V5'
          if marker in s:
              raise SystemExit(0)
          block=r'''\n<style id="aljava-admin-menu-emergency-style">\n/* ALJAVA ADMIN MENU EMERGENCY V5 */\n#adminMenuToggle{display:none!important;pointer-events:none!important}\n#adminMenuBackdrop,.admin-menu-backdrop{display:none!important;pointer-events:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}\n#aljavaEmergencyMenuButton{position:fixed!important;left:18px!important;top:18px!important;z-index:2147483647!important;width:48px!important;height:48px!important;display:none!important;align-items:center!important;justify-content:center!important;padding:0!important;margin:0!important;border:1px solid rgba(39,163,211,.38)!important;border-radius:12px!important;background:rgba(255,255,255,.96)!important;color:#0879b8!important;box-shadow:0 12px 30px rgba(38,139,177,.2)!important;cursor:pointer!important;pointer-events:auto!important;touch-action:manipulation!important;font:900 25px/1 Inter,Poppins,Arial,sans-serif!important}\n#aljavaEmergencyMenuButton.visible{display:flex!important}\n#aljavaEmergencyMenuDrawer{position:fixed!important;left:18px!important;top:76px!important;z-index:2147483646!important;width:280px!important;display:none!important;padding:16px!important;margin:0!important;border:1px solid rgba(55,180,225,.3)!important;border-radius:18px!important;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(220,247,255,.96))!important;box-shadow:0 24px 70px rgba(38,139,177,.25)!important;overflow:visible!important;pointer-events:auto!important}\n#aljavaEmergencyMenuDrawer.open{display:block!important}\n#aljavaEmergencyMenuDrawer h2{margin:0 0 5px;color:#17324d}\n#aljavaEmergencyMenuDrawer p{margin:0 0 12px;color:#58788f;font-size:12px}\n#aljavaEmergencyMenuDrawer button{display:block!important;width:100%!important;min-height:48px!important;margin:8px 0!important;padding:11px 13px!important;border:1px solid rgba(39,163,211,.28)!important;border-radius:10px!important;background:rgba(255,255,255,.82)!important;color:#17324d!important;text-align:left!important;cursor:pointer!important;pointer-events:auto!important;font:800 14px/1.2 Inter,Poppins,Arial,sans-serif!important}\n#aljavaEmergencyMenuDrawer button:hover{background:rgba(53,201,242,.14)!important;border-color:rgba(39,163,211,.55)!important}\n#aljavaEmergencyMenuDrawer .danger{color:#9b3047!important;background:rgba(255,225,232,.82)!important}\n@media(max-width:520px){#aljavaEmergencyMenuButton{left:12px!important;top:12px!important;width:44px!important;height:44px!important}#aljavaEmergencyMenuDrawer{left:12px!important;top:68px!important;width:calc(100vw - 24px)!important}}\n</style>\n<script id="aljava-admin-menu-emergency-script">\n(()=>{\n  const boot=()=>{\n    if(document.getElementById('aljavaEmergencyMenuButton')) return;\n    const app=document.getElementById('app');\n    const wrap=document.createElement('div');\n    wrap.innerHTML='<button id="aljavaEmergencyMenuButton" type="button" aria-label="Buka Main Menu" aria-expanded="false">☰</button><div id="aljavaEmergencyMenuDrawer" role="dialog" aria-label="Main Menu"><h2>Main Menu</h2><p>Pengaturan dan akses admin</p><button type="button" data-action="reset">↻ Reset Dashboard</button><button type="button" data-action="add">＋ Tambah Akun</button><button type="button" data-action="customer">👥 Database Customer</button><button type="button" data-action="logout" class="danger">Keluar / Logout</button></div>';\n    document.body.appendChild(wrap.firstElementChild);\n    document.body.appendChild(wrap.lastElementChild);\n    const b=document.getElementById('aljavaEmergencyMenuButton');\n    const d=document.getElementById('aljavaEmergencyMenuDrawer');\n    const sync=()=>{const visible=!!app&&getComputedStyle(app).display!=='none';b.classList.toggle('visible',visible);if(!visible){d.classList.remove('open');b.setAttribute('aria-expanded','false')}};\n    const toggle=()=>{const open=!d.classList.contains('open');d.classList.toggle('open',open);b.setAttribute('aria-expanded',open?'true':'false')};\n    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggle()},{capture:true});\n    b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()},{capture:true});\n    d.addEventListener('pointerdown',e=>e.stopPropagation(),{capture:true});\n    d.addEventListener('click',e=>{\n      e.stopPropagation();\n      const a=e.target.closest('[data-action]');\n      if(!a)return;\n      if(a.dataset.action==='reset') document.getElementById('refresh')?.click();\n      if(a.dataset.action==='add') document.getElementById('adminAddAccount')?.click();\n      if(a.dataset.action==='customer') document.getElementById('customerDatabase')?.scrollIntoView({behavior:'smooth'});\n      if(a.dataset.action==='logout') document.getElementById('logout')?.click();\n      d.classList.remove('open');b.setAttribute('aria-expanded','false');\n    },{capture:true});\n    document.addEventListener('pointerdown',e=>{if(d.classList.contains('open')&&!d.contains(e.target)&&e.target!==b){d.classList.remove('open');b.setAttribute('aria-expanded','false')}},{capture:true});\n    document.addEventListener('keydown',e=>{if(e.key==='Escape'){d.classList.remove('open');b.setAttribute('aria-expanded','false')}});\n    const obs=app?new MutationObserver(sync):null;if(obs)obs.observe(app,{attributes:true,attributeFilter:['style']});\n    sync();\n    setInterval(sync,400);\n  };\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();\n})();\n</script>\n'''
          s=s.replace('</body>',block+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: make admin main menu definitely clickable [admin-menu-emergency]"
          git push
