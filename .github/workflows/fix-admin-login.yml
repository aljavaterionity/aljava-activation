name: Fix admin login

on:
  push:
    branches: [fix/admin-login-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin login
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          old_css = re.compile(r'\.login\{position:fixed;inset:0;z-index:10;.*?\.loginbox button\{width:100%;margin-top:12px\}', re.S)
          new_css = '''.login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 10%,rgba(0,132,255,.38),transparent 42%),radial-gradient(ellipse at 85% 35%,rgba(0,225,255,.18),transparent 30%),linear-gradient(180deg,#010817 0%,#031b46 48%,#010713 100%);backdrop-filter:blur(4px)}.loginbox{width:min(420px,100%);padding:30px;border-radius:24px;border:1px solid rgba(55,210,255,.55);background:linear-gradient(145deg,rgba(4,25,72,.84),rgba(1,8,35,.95));box-shadow:0 0 35px rgba(0,160,255,.22),0 25px 75px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:relative}.loginbox:before{content:'';display:block;width:55px;height:2px;margin:0 auto 18px;border-radius:999px;background:linear-gradient(90deg,transparent,#25e4ff,transparent);box-shadow:0 0 12px rgba(37,228,255,.7)}.loginbox .brand{display:block;text-align:center;font-size:20px;letter-spacing:3px;background:linear-gradient(90deg,#fff,#35e7ff,#168cff,#fff);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent}.loginbox .muted{color:#9db7cc;text-align:center;font-size:13px;line-height:1.6;margin:10px 0 25px}.loginbox .field{width:100%;height:50px;margin-top:0;margin-bottom:14px;border:1px solid rgba(100,145,190,.45);border-radius:12px;outline:none;color:#fff;background:rgba(5,20,54,.9);font-size:14px}.loginbox .field::placeholder{color:#637f96}.loginbox .field:focus{border-color:#25ddff;box-shadow:0 0 0 3px rgba(0,190,255,.1),0 0 20px rgba(0,170,255,.18)}.loginbox button{width:100%;height:50px;margin-top:2px;border:0;border-radius:12px;color:#fff;background:linear-gradient(90deg,#0757c9,#168cff,#25dfff);font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 25px rgba(0,140,255,.25)}.loginbox button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(0,180,255,.35)}.loginbox button:disabled{opacity:.6;cursor:not-allowed}.loginbox #loginMsg{margin-top:12px}.loginbox #loginMsg .notice.err{border:1px solid rgba(255,90,120,.4);background:rgba(220,40,75,.1);color:#ffdce4}.loginbox #loginMsg .notice.ok{border:1px solid rgba(50,230,255,.4);background:rgba(0,210,255,.1);color:#bffcff}'''
          s2, n = old_css.subn(new_css, s, count=1)
          if n != 1:
              raise SystemExit('login CSS block not found')
          s = s2

          old_admin = '''async function admin(){const{data:{user}}=await sb.auth.getUser();if(!user){$('login').style.display='grid';$('app').style.display='none';return false}const{data:isAdmin}=await sb.rpc('is_admin_user');if(isAdmin!==true){await sb.auth.signOut();$('loginMsg').innerHTML='<div class="notice err">❌ Akun bukan admin.</div>';return false}$('login').style.display='none';$('app').style.display='block';$('userEmail').textContent=user.email||'';return true}'''
          new_admin = '''async function admin(){try{const{data:{session}}=await sb.auth.getSession();if(!session){await sb.auth.signOut({scope:'local'});$('login').style.display='grid';$('app').style.display='none';return false}const{data:{user},error:userError}=await sb.auth.getUser();if(userError||!user){await sb.auth.signOut({scope:'local'});$('login').style.display='grid';$('app').style.display='none';return false}const{data:isAdmin,error:adminError}=await sb.rpc('is_admin_user');if(adminError||isAdmin!==true){await sb.auth.signOut({scope:'local'});$('login').style.display='grid';$('app').style.display='none';$('loginMsg').innerHTML='<div class="notice err">❌ Akun bukan admin.</div>';return false}$('login').style.display='none';$('app').style.display='block';$('userEmail').textContent=user.email||'';return true}catch(e){await sb.auth.signOut({scope:'local'});$('login').style.display='grid';$('app').style.display='none';$('loginMsg').innerHTML='<div class="notice err">❌ Sesi login kedaluwarsa. Silakan masuk lagi.</div>';return false}}'''
          if old_admin not in s:
              raise SystemExit('admin function not found')
          s = s.replace(old_admin, new_admin, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/fix-admin-login.yml
          git commit -m "fix: restore dark admin login and handle expired sessions" || exit 0
          git push