name: Separate Admin Menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-menu:
    if: ${{ !contains(github.event.head_commit.message, '[admin-menu-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild admin menu layout
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          # Remove older hamburger controls/scripts so the menu never duplicates.
          s = re.sub(r'<button\s+id=["\']adminMenuToggle["\'][\s\S]*?</button>', '', s)
          s = re.sub(r'<div\s+id=["\']adminMenuBackdrop["\'][\s\S]*?</div>', '', s)
          s = re.sub(r'<script\s+id=["\']aljava-admin-menu-layout-script["\'][\s\S]*?</script>', '', s)
          s = re.sub(r'\s*/\* ALJAVA ADMIN MENU LAYOUT V2 \*/[\s\S]*?(?=</style>)', '', s)
          s = re.sub(r'\s*/\* ALJAVA ADMIN MENU LAYOUT V3 \*/[\s\S]*?(?=</style>)', '', s)

          css = r'''\n/* ALJAVA ADMIN MENU LAYOUT V3 */
          .admin-top{position:relative;display:flex!important;align-items:center!important;gap:12px!important}
          .admin-menu-toggle{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:46px;height:46px;padding:0;border:1px solid rgba(39,163,211,.32);border-radius:12px;background:rgba(255,255,255,.78);color:#0879b8;box-shadow:0 10px 28px rgba(38,139,177,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;font-size:24px;font-weight:900;line-height:1;transition:.2s ease}
          .admin-menu-toggle:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(38,139,177,.22);background:rgba(255,255,255,.92)}
          .admin-menu-toggle:focus-visible{outline:3px solid rgba(53,201,242,.24);outline-offset:2px}
          .admin-menu-toggle span{display:block;line-height:1}
          .admin-menu{position:fixed!important;left:18px!important;top:78px!important;z-index:44!important;width:min(280px,calc(100vw - 36px))!important;margin:0!important;padding:16px!important;transform:translateX(calc(-100% - 26px));opacity:0;pointer-events:none;visibility:hidden;transition:transform .24s ease,opacity .2s ease,visibility .24s ease;box-shadow:0 24px 70px rgba(38,139,177,.22)!important}
          .admin-menu.menu-open{transform:translateX(0);opacity:1;pointer-events:auto;visibility:visible}
          .admin-menu h2{margin:0 0 4px}.admin-menu .muted{line-height:1.5}.admin-menu-grid{display:grid!important;grid-template-columns:1fr!important;gap:9px!important;margin-top:12px}
          .admin-menu-grid .btn{width:100%;min-height:48px;text-align:left;padding:11px 13px}
          .admin-menu-backdrop{position:fixed;inset:0;z-index:43;background:rgba(11,48,75,.14);display:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
          .admin-menu-backdrop.show{display:block}
          .admin-menu-mobile-spacer{display:none}
          @media(max-width:700px){.admin-top{gap:9px}.admin-menu-toggle{width:44px;height:44px;font-size:22px}.admin-menu{left:12px!important;top:70px!important;width:calc(100vw - 24px)!important}.admin-menu-grid .btn{min-height:46px}}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)

          header = '<header class="top admin-top"><button id="adminMenuToggle" class="admin-menu-toggle" type="button" aria-label="Buka Main Menu" aria-expanded="false"><span>☰</span></button>'
          s = s.replace('<header class="top">', header, 1)

          html = r'''<div id="adminMenuBackdrop" class="admin-menu-backdrop"></div>'''
          s = s.replace('<body>', '<body>' + html, 1)

          js = r'''\n<script id="aljava-admin-menu-layout-script-v3">
          (()=>{
            const setup=()=>{
              const toggle=document.getElementById('adminMenuToggle');
              const menu=document.querySelector('.admin-menu');
              const backdrop=document.getElementById('adminMenuBackdrop');
              if(!toggle||!menu||!backdrop)return false;
              const close=()=>{menu.classList.remove('menu-open');backdrop.classList.remove('show');toggle.setAttribute('aria-expanded','false');};
              const open=()=>{menu.classList.add('menu-open');backdrop.classList.add('show');toggle.setAttribute('aria-expanded','true');};
              toggle.addEventListener('click',()=>menu.classList.contains('menu-open')?close():open());
              backdrop.addEventListener('click',close);
              document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
              menu.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>close()));
              return true;
            };
            if(!setup()) document.addEventListener('DOMContentLoaded',setup,{once:true});
          })();
          </script>'''
          s = s.replace('</main>', js + '\n</main>', 1)
          p.write_text(s, encoding='utf-8')
          print('admin menu v3 installed')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: rebuild separate admin hamburger menu [admin-menu-v3]"
          git push
