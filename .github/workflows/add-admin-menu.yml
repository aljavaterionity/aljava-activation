name: Add Admin Menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-admin:
    if: ${{ !contains(github.event.head_commit.message, '[admin-menu]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ALJAVA ADMIN MENU V1 */'
          if marker in s:
              print('Admin menu already installed')
              raise SystemExit(0)
          css = r'''<style id="aljava-admin-menu-style">
          .admin-menu{margin-top:18px;padding:14px 16px}.admin-menu h2{margin:0 0 10px}.admin-menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.admin-menu button{min-height:48px}.admin-menu .menu-settings{background:rgba(255,255,255,.72)}
          .customer-panel{margin-top:14px}.customer-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.customer-search{min-width:240px;flex:1}.customer-table{min-width:900px}.link-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:8px;text-decoration:none;font-weight:800;color:#0879b8;background:rgba(53,201,242,.12);border:1px solid rgba(39,163,211,.22)}
          .admin-modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:18px;background:rgba(4,22,45,.38);backdrop-filter:blur(5px)}.admin-modal.show{display:grid}.admin-modal-card{width:min(520px,100%);padding:20px}.admin-modal-card h3{margin:0 0 8px}.admin-modal-card .actions{margin-top:14px;justify-content:flex-end}
          @media(max-width:800px){.admin-menu-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.admin-menu-grid{grid-template-columns:1fr}.customer-search{min-width:100%}}
          </style>'''
          html = r'''<!-- ALJAVA ADMIN MENU V1 -->
          <section class="glass admin-menu panel">
            <div class="row"><div><h2>Main Menu</h2><p class="muted">Pengaturan dan akses cepat admin.</p></div></div>
            <div class="admin-menu-grid">
              <button id="adminReset" class="btn">↻ Reset Dashboard</button>
              <button id="adminAddAccount" class="btn">＋ Tambah Akun</button>
              <button id="adminCustomerTop" class="btn">👥 Database Customer</button>
              <button id="adminLogout" class="btn danger">Keluar / Logout</button>
            </div>
          </section>
          <section id="customerDatabase" class="glass customer-panel panel">
            <div class="head"><div class="customer-toolbar"><div><h2 style="margin:0">Database Customer</h2><p class="muted">ID, usaha, jenis kartu, jumlah kartu, total ulasan, dan link Google Review.</p></div><input id="customerSearch" class="field customer-search" placeholder="Cari nama usaha / ID..."></div></div>
            <div class="body"><div class="table-wrap"><table class="customer-table"><thead><tr><th>ID</th><th>Nama Usaha</th><th>Jenis Kartu</th><th>Jumlah Dimiliki</th><th>Total Ulasan</th><th>Link Google Review</th></tr></thead><tbody id="customerRows"><tr><td colspan="6" class="muted">Memuat data customer...</td></tr></tbody></table></div><div id="customerMsg"></div></div>
          </section>
          <div id="adminModal" class="admin-modal"><div class="glass admin-modal-card"><h3 id="adminModalTitle">Pengaturan</h3><div id="adminModalBody"></div><div class="actions"><button id="adminModalClose" class="btn">Tutup</button></div></div></div>
          '''
          js = r'''<script id="aljava-admin-menu-script">
          (()=>{
            const marker='/* ALJAVA ADMIN MENU V1 */';
            const $=id=>document.getElementById(id);
            const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            let customerData=[];
            async function loadCustomers(){
              const rows=$('customerRows'), msg=$('customerMsg'); if(!rows) return;
              rows.innerHTML='<tr><td colspan="6" class="muted">Memuat data customer...</td></tr>';
              try{
                const {data,error}=await supabase.from('Customers').select('id,business_name,product_type,google_review_url').order('created_at',{ascending:false});
                if(error) throw error;
                const customers=data||[];
                const ids=customers.map(x=>x.id).filter(Boolean);
                let counts={};
                if(ids.length){
                  const {data:cards,error:ce}=await supabase.from('Cards').select('customer_id,product_type').in('customer_id',ids);
                  if(ce) throw ce;
                  (cards||[]).forEach(c=>{counts[c.customer_id]??={qty:0,types:{}};counts[c.customer_id].qty++;if(c.product_type) counts[c.customer_id].types[c.product_type]=(counts[c.customer_id].types[c.product_type]||0)+1;});
                }
                customerData=customers.map(c=>({id:c.id,business_name:c.business_name||'-',product_type:c.product_type||Object.keys(counts[c.id]?.types||{}).join(', ')||'-',qty:counts[c.id]?.qty||0,reviews:0,url:c.google_review_url||''}));
                renderCustomers();
              }catch(e){rows.innerHTML='<tr><td colspan="6"><div class="notice err">Gagal memuat database customer: '+esc(e.message)+'</div></td></tr>';if(msg)msg.innerHTML='';}
            }
            function renderCustomers(){
              const rows=$('customerRows'), q=($('customerSearch')?.value||'').toLowerCase().trim(); if(!rows)return;
              const list=customerData.filter(c=>!q||c.business_name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q));
              rows.innerHTML=list.length?list.map(c=>`<tr><td>${esc(c.id)}</td><td><b>${esc(c.business_name)}</b></td><td>${esc(c.product_type)}</td><td>${c.qty}</td><td>${c.reviews}</td><td>${c.url?`<a class="link-btn" href="${esc(c.url)}" target="_blank" rel="noopener">🔗 Buka Review</a>`:'<span class="muted">Belum ada link</span>'}</td></tr>`).join(''):'<tr><td colspan="6" class="muted">Tidak ada customer.</td></tr>';
            }
            function modal(title,body){$('adminModalTitle').textContent=title;$('adminModalBody').innerHTML=body;$('adminModal').classList.add('show');}
            function wire(){
              if(!$('adminReset')) return;
              $('adminReset').onclick=()=>{ if($('year'))$('year').value='';if($('month'))$('month').value='';$('adminModal').classList.remove('show');$('refresh')?.click();window.scrollTo({top:0,behavior:'smooth'}); };
              $('adminLogout').onclick=()=>$('logout')?.click();
              $('adminCustomerTop').onclick=()=>$('customerDatabase')?.scrollIntoView({behavior:'smooth'});
              $('customerSearch').oninput=renderCustomers;
              $('adminAddAccount').onclick=()=>modal('Tambah Akun','<div class="notice info">Fitur tambah akun admin membutuhkan proses server-side/privileged auth. Tidak ada akun atau password yang dibuat otomatis dari browser. Gunakan menu pengelolaan akun yang sudah disiapkan di server.</div>');
              $('adminModalClose').onclick=()=>$('adminModal').classList.remove('show');
              $('adminModal').onclick=e=>{if(e.target.id==='adminModal')$('adminModal').classList.remove('show')};
              loadCustomers();
            }
            const boot=setInterval(()=>{if($('app')&&$('app').style.display!=='none'){clearInterval(boot);wire();}},300);
          })();
          </script>'''
          injection = css + html + js
          s = s.replace('</main>', injection + '</main>', 1)
          p.write_text(s, encoding='utf-8')
          print('patched admin.html')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add admin main menu and customer database [admin-menu]"
          git push
