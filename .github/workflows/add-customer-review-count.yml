name: Connect Customer Review Count

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-admin:
    if: ${{ !contains(github.event.head_commit.message, '[customer-reviews]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect Total Ulasan to Customers.total_reviews
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old_select = "select('id,business_name,product_type,google_review_url')"
          new_select = "select('id,business_name,product_type,google_review_url,total_reviews')"
          s2 = s.replace(old_select, new_select)
          old_map = "url:c.google_review_url||''}));"
          new_map = "url:c.google_review_url||'',reviews:Number.isFinite(Number(c.total_reviews))?Number(c.total_reviews):0}));"
          s2 = s2.replace(old_map, new_map)
          if s2 == s:
              print('No patch target found; admin may already be connected')
              raise SystemExit(0)
          p.write_text(s2, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect total reviews to customer database [customer-reviews]"
          git push
