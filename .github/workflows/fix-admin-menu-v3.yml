name: Fix Admin Menu V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-menu:
    if: ${{ !contains(github.event.head_commit.message, '[admin-menu-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hamburger menu state
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ALJAVA ADMIN MENU V3 */'
          if marker in s:
              print('V3 already installed')
              raise SystemExit(0)
          css = r'''
          /* ALJAVA ADMIN MENU V3 */
          #adminMenuToggle{position:fixed!important;left:18px!important;top:18px!important;z-index:100!important;width:48px!important;height:48px!important;display:grid!important;place-items:center!important;padding:0!important;border:1px solid rgba(39,163,211,.35)!important;border-radius:12px!important;background:rgba(255,255,255,.92)!important;color:#0879b8!important;box-shadow:0 12px 30px rgba(38,139,177,.18)!important;cursor:pointer!important;font-size:25px!important;font-weight:900!important;line-height:1!important}
          #adminMenuBackdrop{position:fixed!important;inset:0!important;z-index:90!important;display:none!important;background:rgba(11,48,75,.10)!important;backdrop-filter:blur(2px)!important;-webkit-backdrop-filter:blur(2px)!important}
          #adminMenuBackdrop.is-open{display:block!important}
          .admin-menu{position:fixed!important;left:18px!important;top:76px!important;z-index:95!important;width:280px!important;margin:0!important;padding:16px!important;display:none!important;transform:none!important;opacity:1!important;pointer-events:auto!important;box-shadow:0 24px 70px rgba(38,139,177,.24)!important}
          .admin-menu.is-open{display:block!important}
          .admin-menu-grid{display:grid!important;grid-template-columns:1fr!important;gap:10px!important}
          .admin-menu-grid .btn{width:100%!important;min-height:48px!important;text-align:left!important}
          @media(max-width:520px){#adminMenuToggle{left:12px!important;top:12px!important}.admin-menu{left:12px!important;right:12px!important;width:auto!important;top:72px!important}}
          '''
          js = r'''<script id="aljava-admin-menu-v3-script">
          (()=>{
            const boot=()=>{
              const toggle=document.getElementById('adminMenuToggle');
              const menu=document.querySelector('.admin-menu');
              const backdrop=document.getElementById('adminMenuBackdrop');
              if(!toggle||!menu||!backdrop){return false;}
              const close=()=>{menu.classList.remove('is-open');backdrop.classList.remove('is-open');toggle.setAttribute('aria-expanded','false');};
              const open=()=>{menu.classList.add('is-open');backdrop.classList.add('is-open');toggle.setAttribute('aria-expanded','true');};
              close();
              toggle.onclick=(e)=>{e.preventDefault();e.stopPropagation();menu.classList.contains('is-open')?close():open();};
              backdrop.onclick=close;
              document.addEventListener('keydown',(e)=>{if(e.key==='Escape')close();});
              menu.addEventListener('click',(e)=>e.stopPropagation());
              return true;
            };
            if(!boot()) document.addEventListener('DOMContentLoaded',()=>boot());
          })();
          </script>'''
          s = s.replace('</style>', css + '\n</style>', 1)
          s = s.replace('</main>', js + '</main>', 1)
          p.write_text(s, encoding='utf-8')
          print('patched admin menu V3')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: make admin hamburger menu open cleanly [admin-menu-v3]"
          git push
