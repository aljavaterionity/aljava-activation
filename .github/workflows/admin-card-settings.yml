name: Admin Card Settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[admin-card-settings]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move card creation into Pengaturan Kartu menu
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ALJAVA ADMIN CARD SETTINGS'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)

          css = r'''
          <style id="aljava-admin-card-settings-style">
          /* ALJAVA ADMIN CARD SETTINGS */
          #aljavaCardSettingsPanel{display:none!important;margin-top:14px}
          #aljavaCardSettingsPanel.card-settings-open{display:block!important}
          #aljavaCardSettingsPanel .card-settings-close{float:right}
          #aljavaCardSettingsPanel .card-settings-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
          #aljavaCardSettingsPanel .card-settings-title h2{margin:0}
          #aljavaCardSettingsPanel .card-settings-body{padding:18px}
          #aljavaCardSettingsPanel .card-settings-body > section{display:block!important;margin-top:0!important}
          #aljavaCardSettingsPanel .card-settings-body > section + section{margin-top:14px!important}
          #aljavaCardSettingsOpen{font-weight:900}
          </style>
          '''

          js = r'''
          <script id="aljava-admin-card-settings-script">
          (()=>{
            const findCardSection=()=>[...document.querySelectorAll('section')].find(el=>/Kelola Kartu/i.test(el.textContent||''));
            const ensure=()=>{
              const drawer=document.getElementById('aljavaMenuV4Drawer');
              const app=document.getElementById('app');
              const original=findCardSection();
              if(!drawer||!app||!original)return false;
              original.id='aljavaOriginalCardSettings';
              original.style.display='none';

              let panel=document.getElementById('aljavaCardSettingsPanel');
              if(!panel){
                panel=document.createElement('section');
                panel.id='aljavaCardSettingsPanel';
                panel.className='glass panel';
                panel.innerHTML='<div class="head"><div class="card-settings-title"><div><h2>Pengaturan Kartu</h2><p class="muted">Pembuatan satu kartu dan banyak kartu.</p></div><button id="aljavaCardSettingsClose" class="btn card-settings-close" type="button">Tutup</button></div></div><div id="aljavaCardSettingsBody" class="card-settings-body"></div>';
                app.insertBefore(panel, app.firstElementChild?.nextSibling || app.firstChild);
                panel.querySelector('#aljavaCardSettingsBody').appendChild(original);
              }

              let btn=drawer.querySelector('[data-card-settings]');
              if(!btn){
                btn=document.createElement('button');
                btn.type='button';
                btn.dataset.cardSettings='1';
                btn.id='aljavaMenuCardSettings';
                btn.textContent='⚙ Pengaturan Kartu';
                drawer.insertBefore(btn, drawer.querySelector('[data-target="adminCustomerTop"]')||null);
                btn.addEventListener('click',()=>{
                  panel.classList.add('card-settings-open');
                  original.style.display='block';
                  panel.scrollIntoView({behavior:'smooth',block:'start'});
                  drawer.classList.remove('v4-open');
                  const b=document.getElementById('aljavaMenuV4Button');
                  if(b)b.setAttribute('aria-expanded','false');
                });
              }
              const close=panel.querySelector('#aljavaCardSettingsClose');
              if(close&&!close.dataset.bound){
                close.dataset.bound='1';
                close.addEventListener('click',()=>{panel.classList.remove('card-settings-open');original.style.display='none';window.scrollTo({top:0,behavior:'smooth'});});
              }
              return true;
            };
            const timer=setInterval(()=>{if(ensure())clearInterval(timer)},250);
          })();
          </script>
          '''

          s = s.replace('</head>', css + '\n</head>', 1)
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: move card creation into Pengaturan Kartu menu [admin-card-settings]"
          git push
