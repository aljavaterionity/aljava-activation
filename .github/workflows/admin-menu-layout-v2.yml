name: Admin Menu Layout V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  layout:
    if: ${{ !contains(github.event.head_commit.message, '[admin-menu-layout-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make main menu a hamburger drawer
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ALJAVA ADMIN MENU LAYOUT V2 */'
          if marker not in s:
              s = s.replace('</style>', '''\n/* ALJAVA ADMIN MENU LAYOUT V2 */\n.admin-menu-toggle{position:fixed;left:18px;top:18px;z-index:45;width:48px;height:48px;padding:0;border:1px solid rgba(39,163,211,.32);border-radius:12px;background:rgba(255,255,255,.88);color:#0879b8;box-shadow:0 12px 30px rgba(38,139,177,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;font-size:25px;font-weight:900;line-height:1}.admin-menu-toggle:hover{transform:translateY(-1px)}.admin-menu{position:fixed!important;left:18px!important;top:76px!important;z-index:44!important;width:270px!important;margin:0!important;padding:16px!important;transform:translateX(calc(-100% - 30px));opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease;box-shadow:0 24px 70px rgba(38,139,177,.24)!important}.admin-menu.menu-open{transform:translateX(0);opacity:1;pointer-events:auto}.admin-menu-backdrop{position:fixed;inset:0;z-index:43;background:rgba(11,48,75,.12);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:none}.admin-menu-backdrop.show{display:block}.admin-menu h2{margin:0 0 10px}.admin-menu-grid{grid-template-columns:1fr!important}.admin-menu-grid button{width:100%;min-height:48px}.menu-settings{display:block}@media(max-width:700px){.admin-menu-toggle{left:12px;top:12px}.admin-menu{left:12px!important;top:70px!important;width:min(270px,calc(100vw - 24px))!important}\n''' + '</style>', 1)
          if 'id="adminMenuToggle"' not in s:
              s = s.replace('<body>', '<body><button id="adminMenuToggle" class="admin-menu-toggle" type="button" aria-label="Buka Main Menu" aria-expanded="false">☰</button><div id="adminMenuBackdrop" class="admin-menu-backdrop"></div>', 1)
          if 'aljava-admin-menu-layout-script' not in s:
              script = '''<script id="aljava-admin-menu-layout-script">(()=>{const t=document.getElementById('adminMenuToggle'),m=document.querySelector('.admin-menu'),b=document.getElementById('adminMenuBackdrop');if(!t||!m||!b)return;const close=()=>{m.classList.remove('menu-open');b.classList.remove('show');t.setAttribute('aria-expanded','false')};const open=()=>{m.classList.add('menu-open');b.classList.add('show');t.setAttribute('aria-expanded','true')};t.addEventListener('click',()=>m.classList.contains('menu-open')?close():open());b.addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});m.querySelectorAll('button').forEach(x=>x.addEventListener('click',()=>{if(x.id!=='adminAddAccount')close()}));})();</script>'''
              s = s.replace('</main>', script + '</main>', 1)
          s = s.replace("from('Customers')", "from('Customers')")
          s = s.replace("supabase.from('Customers')", "sb.from('Customers')")
          s = s.replace("supabase.from('Cards')", "sb.from('Cards')")
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: separate main menu with hamburger button [admin-menu-layout-v2]"
          git push
