name: Update Customer Database Columns

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[customer-columns]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin customer table
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old='''<p class="muted">ID, usaha, jenis kartu, jumlah kartu, total ulasan, dan link Google Review.</p></div><input id="customerSearch"'''
          new='''<p class="muted">ID, usaha, jenis kartu, status, total scan/tap, dan link Google Review.</p></div><input id="customerSearch"'''
          s=s.replace(old,new)
          s=s.replace('<th>ID</th><th>Nama Usaha</th><th>Jenis Kartu</th><th>Jumlah Dimiliki</th><th>Total Ulasan</th><th>Link Google Review</th>','<th>ID</th><th>Nama Usaha</th><th>Jenis Kartu</th><th>Status</th><th>Total Scan/Tap</th><th>Link Google Review</th>')
          old_js="""const {data,error}=await supabase.from('Customers').select('id,business_name,product_type,google_review_url').order('created_at',{ascending:false});"""
          new_js="""const {data,error}=await supabase.from('Customers').select('id,business_name,product_type,status,google_review_url').order('created_at',{ascending:false});"""
          s=s.replace(old_js,new_js)
          old_map="""customerData=customers.map(c=>({id:c.id,business_name:c.business_name||'-',product_type:c.product_type||Object.keys(counts[c.id]?.types||{}).join(', ')||'-',qty:counts[c.id]?.qty||0,reviews:0,url:c.google_review_url||''}));"""
          new_map="""customerData=customers.map(c=>({id:c.id,business_name:c.business_name||'-',product_type:c.product_type||Object.keys(counts[c.id]?.types||{}).join(', ')||'-',status:c.status||'Pending',scans:0,url:c.google_review_url||''}));"""
          s=s.replace(old_map,new_map)
          old_render="""rows.innerHTML=list.length?list.map(c=>`<tr><td>${esc(c.id)}</td><td><b>${esc(c.business_name)}</b></td><td>${esc(c.product_type)}</td><td>${c.qty}</td><td>${c.reviews}</td><td>${c.url?`<a class=\"link-btn\" href=\"${esc(c.url)}\" target=\"_blank\" rel=\"noopener\">🔗 Buka Review</a>`:'<span class=\"muted\">Belum ada link</span>'}</td></tr>`).join(''):'<tr><td colspan=\"6\" class=\"muted\">Tidak ada customer.</td></tr>';"""
          new_render="""rows.innerHTML=list.length?list.map(c=>`<tr><td>${esc(c.id)}</td><td><b>${esc(c.business_name)}</b></td><td>${esc(c.product_type)}</td><td><span class=\"${String(c.status).toLowerCase()==='active'?'active':String(c.status).toLowerCase()==='expired'?'expired':'pending'}\">${esc(c.status)}</span></td><td>${c.scans}</td><td>${c.url?`<a class=\"link-btn\" href=\"${esc(c.url)}\" target=\"_blank\" rel=\"noopener\">🔗 Buka Review</a>`:'<span class=\"muted\">Belum ada link</span>'}</td></tr>`).join(''):'<tr><td colspan=\"6\" class=\"muted\">Tidak ada customer.</td></tr>';"""
          s=s.replace(old_render,new_render)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/fix-customer-columns.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: use status and scan tap in customer database [customer-columns]"
          git push
