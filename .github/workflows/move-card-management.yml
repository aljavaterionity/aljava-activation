name: Move Card Management Into Main Menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[move-card-management]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Kelola Kartu into Main Menu
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ALJAVA MOVE CARD MANAGEMENT INTO MAIN MENU'
          if marker in s:
              raise SystemExit(0)
          css = r'''<style id="aljava-move-card-management-style">
          /* ALJAVA MOVE CARD MANAGEMENT INTO MAIN MENU */
          #cardManagementSection{display:none!important}
          #aljavaMenuV4Drawer .menu-card-management{display:block!important;width:100%!important;min-height:48px!important;margin:8px 0!important;padding:11px 13px!important;border:1px solid rgba(39,163,211,.28)!important;border-radius:10px!important;background:rgba(255,255,255,.78)!important;color:#17324d!important;text-align:left!important;font:800 14px/1.2 Inter,Poppins,Arial,sans-serif!important;cursor:pointer!important;pointer-events:auto!important}
          #aljavaMenuV4Drawer .menu-card-management:hover{background:rgba(53,201,242,.14)!important;border-color:rgba(39,163,211,.55)!important}
          </style>'''
          js = r'''<script id="aljava-move-card-management-script">
          (()=>{
            const init=()=>{
              const sections=[...document.querySelectorAll('section.glass.panel')];
              const cardSection=sections.find(x=>x.querySelector('h2')?.textContent.trim()==='Kelola Kartu');
              if(!cardSection) return false;
              cardSection.id='cardManagementSection';
              cardSection.style.setProperty('display','none','important');
              const drawer=document.getElementById('aljavaMenuV4Drawer');
              if(!drawer) return false;
              let btn=drawer.querySelector('.menu-card-management');
              if(!btn){
                btn=document.createElement('button');
                btn.type='button';
                btn.className='menu-card-management';
                btn.textContent='💳 Kelola Kartu';
                drawer.appendChild(btn);
              }
              if(btn.dataset.bound==='1') return true;
              btn.dataset.bound='1';
              btn.addEventListener('click',(e)=>{
                e.preventDefault(); e.stopPropagation();
                cardSection.style.removeProperty('display');
                cardSection.scrollIntoView({behavior:'smooth',block:'start'});
                const d=document.getElementById('aljavaMenuV4Drawer');
                d?.classList.remove('v4-open');
                document.getElementById('aljavaMenuV4Button')?.setAttribute('aria-expanded','false');
              });
              return true;
            };
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init,{once:true}); else init();
            setTimeout(init,700); setTimeout(init,1500);
          })();
          </script>'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: move card management into main menu [move-card-management]"
          git push
