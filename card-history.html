<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History Scan/Tap - ALJAVA TERIONITY</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Poppins,Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 0%,rgba(0,132,255,.32),transparent 40%),linear-gradient(180deg,#010817,#031b46 50%,#010713)}.page{width:min(1050px,100%);margin:auto;padding:25px 16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;letter-spacing:2px;color:#35e7ff}.back{color:#fff;text-decoration:none;border:1px solid rgba(45,220,255,.5);padding:9px 13px;border-radius:10px;background:rgba(0,130,255,.15);font-size:12px;font-weight:800}.card{border:1px solid rgba(55,210,255,.35);border-radius:20px;background:linear-gradient(145deg,rgba(4,25,72,.82),rgba(1,8,35,.94));overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}.head{padding:20px;border-bottom:1px solid rgba(55,180,255,.2)}h1{margin:0;font-size:22px}.muted{color:#9db7cc;font-size:11px;margin-top:6px}.controls{padding:20px;display:grid;grid-template-columns:1fr auto;gap:12px}select{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(55,210,255,.35);background:#041333;color:#fff}button{padding:12px 16px;border-radius:10px;border:1px solid rgba(45,220,255,.5);background:rgba(0,130,255,.15);color:#fff;font-weight:800;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px 20px}.box{padding:15px;border:1px solid rgba(55,210,255,.2);border-radius:12px}.label{color:#9db7cc;font-size:10px}.value{margin-top:7px;color:#35e7ff;font-size:20px;font-weight:900}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 16px;border-top:1px solid rgba(100,150,200,.12);font-size:11px}th{color:#bfefff;background:rgba(0,90,180,.12)}.empty,.loading{padding:40px;text-align:center;color:#9db7cc;font-size:12px}.error{margin:20px;padding:14px;border:1px solid rgba(255,90,120,.4);border-radius:10px;color:#ffdce4;background:rgba(220,40,75,.1)}@media(max-width:650px){.controls,.summary{grid-template-columns:1fr}.top{gap:12px;align-items:flex-start;flex-direction:column}}</style></head><body><main class="page"><header class="top"><div><div class="brand">ALJAVA TERIONITY</div><div class="muted">History Scan / Tap per ID Kartu</div></div><a class="back" href="admin.html">← Dashboard</a></header><section class="card"><div class="head"><h1>Riwayat Scan / Tap</h1><div class="muted">Pilih satu ID kartu untuk melihat seluruh aktivitasnya.</div></div><div class="controls"><select id="cardSelect"><option value="">Memuat kartu...</option></select><button id="refresh">↻ Refresh</button></div><div class="summary"><div class="box"><div class="label">Total aktivitas</div><div class="value" id="total">0</div></div><div class="box"><div class="label">Scan</div><div class="value" id="scan">0</div></div><div class="box"><div class="label">Tap</div><div class="value" id="tap">0</div></div></div><div id="content"><div class="loading">Memuat...</div></div></section></main><script>const URL='https://lbzwmcxwxummitldxucj.supabase.co',KEY='sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw';let token=localStorage.getItem('supabase_access_token')||'';const esc=v=>String(v??'-').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function get(path){const r=await fetch(URL+path,{headers:{apikey:KEY,Authorization:'Bearer '+token}});const t=await r.text();let d;try{d=t?JSON.parse(t):[]}catch(e){d={message:t}}if(!r.ok)throw Error(d.message||'Gagal mengambil data');return d}async function load(){try{const cards=await get('/rest/v1/Cards?select=id,card_code,product_type&order=created_at.desc'),sel=document.getElementById('cardSelect');sel.innerHTML='<option value="">Pilih ID kartu...</option>'+cards.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.card_code)+' — ID: '+esc(c.id)+'</option>').join('');const wanted=new URLSearchParams(location.search).get('card_id');if(wanted&&cards.some(c=>String(c.id)===wanted))sel.value=wanted;await history()}catch(e){document.getElementById('content').innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}async function history(){const id=document.getElementById('cardSelect').value;if(!id){document.getElementById('content').innerHTML='<div class="empty">Pilih ID kartu untuk melihat history.</div>';['total','scan','tap'].forEach(x=>document.getElementById(x).textContent='0');return}try{const rows=await get('/rest/v1/CardScans?select=id,card_id,card_code,event_type,scanned_at&card_id=eq.'+encodeURIComponent(id)+'&order=scanned_at.desc');const scan=rows.filter(x=>String(x.event_type||'scan').toLowerCase()==='scan').length,tap=rows.filter(x=>String(x.event_type||'').toLowerCase()==='tap').length;document.getElementById('total').textContent=rows.length;document.getElementById('scan').textContent=scan;document.getElementById('tap').textContent=tap;if(!rows.length){document.getElementById('content').innerHTML='<div class="empty">Belum ada aktivitas untuk kartu ini.</div>';return}document.getElementById('content').innerHTML='<div class="table"><table><thead><tr><th>Waktu</th><th>ID Kartu</th><th>Kode</th><th>Jenis Aktivitas</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(new Date(x.scanned_at).toLocaleString('id-ID'))+'</td><td>'+esc(x.card_id)+'</td><td>'+esc(x.card_code)+'</td><td>'+esc(x.event_type||'scan')+'</td></tr>').join('')+'</tbody></table></div>'}catch(e){document.getElementById('content').innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}document.getElementById('cardSelect').onchange=history;document.getElementById('refresh').onclick=load;load();</script></body></html>
