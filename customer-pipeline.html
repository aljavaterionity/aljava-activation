<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALJAVA — Customer Pipeline</title><link rel="stylesheet" href="/assets/business-hub.css"></head><body><main class="page"><header class="topbar"><div><div class="eyebrow">ALJAVA TERIONITY</div><h1>Customer Pipeline</h1><p>Kelola lead sampai deal berdasarkan unit bisnis aktif.</p></div><div class="top-actions"><select id="unit" class="btn secondary"></select><a class="btn secondary" href="/management-control.html">Control Center</a><a class="btn secondary" href="/business-dashboard.html">Dashboard</a></div></header><section id="notice" class="notice" hidden></section><section class="card section-card"><div class="section-head"><div><h2>Pipeline</h2><p>Lead → Contacted → Qualified → Proposal → Negotiation → Won/Lost</p></div><button id="refresh" class="btn secondary">Refresh</button></div><div id="table" class="table-wrap"></div></section><section class="card section-card"><h2>Tambah Pipeline</h2><form id="form"><div class="form-grid"><select id="customer" required><option value="">Pilih customer...</option></select><select id="stage"><option value="lead">Lead</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="proposal">Proposal</option><option value="negotiation">Negotiation</option><option value="won">Won</option><option value="lost">Lost</option></select><input id="value" type="number" min="0" step="1000" placeholder="Estimasi nilai"><input id="follow" type="date" placeholder="Follow-up"><textarea id="notes" placeholder="Catatan"></textarea></div><button class="btn primary" type="submit">Simpan Pipeline</button></form></section><footer>ALJAVA TERIONITY • Customer Pipeline</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/app-config.js"></script><script src="/assets/business-context.js"></script><script>(()=>{'use strict';const sb=window.__ALJAVA_SUPABASE_CLIENT,$=id=>document.getElementById(id);let units=[],active=null;const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const notice=(t,c='info')=>{const e=$('notice');e.hidden=!t;e.className='notice '+c;e.textContent=t};async function load(){const ctx=await window.ALJAVA_BUSINESS_CONTEXT.load();units=ctx.units||[];active=ctx.active;if(!active){notice('Tidak ada unit bisnis aktif.','err');return}$('unit').innerHTML=units.map(u=>`<option value="${u.id}">${esc(u.name)} • ${esc(u.role||'')}</option>`).join('');$('unit').value=active.id;await Promise.all([customers(),pipeline()])}async function customers(){const r=await sb.from('Customers').select('*').order('created_at',{ascending:false});if(r.error){notice('Customer gagal dimuat: '+r.error.message,'err');return}const rows=r.data||[];$('customer').innerHTML='<option value="">Pilih customer...</option>'+rows.map(x=>`<option value="${x.id}">${esc(x.name||x.customer_name||x.email||x.id)}</option>`).join('')}async function pipeline(){notice('Memuat pipeline...');const r=await sb.from('customer_pipeline').select('id,customer_id,stage,estimated_value,next_follow_up,notes,created_at').eq('business_unit_id',active.id).order('created_at',{ascending:false});if(r.error){notice('Pipeline gagal dimuat: '+r.error.message,'err');return}const ids=[...new Set((r.data||[]).map(x=>x.customer_id).filter(Boolean))];let cm={};if(ids.length){const q=await sb.from('Customers').select('*').in('id',ids);(q.data||[]).forEach(x=>cm[x.id]=x)}$('table').innerHTML=`<table><thead><tr><th>Customer</th><th>Stage</th><th>Nilai</th><th>Follow-up</th><th>Aksi</th></tr></thead><tbody>${(r.data||[]).map(x=>`<tr><td>${esc(cm[x.customer_id]?.name||cm[x.customer_id]?.customer_name||cm[x.customer_id]?.email||x.customer_id)}</td><td><select data-stage="${x.id}">${['lead','contacted','qualified','proposal','negotiation','won','lost'].map(s=>`<option ${s===x.stage?'selected':''}>${s}</option>`).join('')}</select></td><td>Rp ${Number(x.estimated_value||0).toLocaleString('id-ID')}</td><td>${esc(x.next_follow_up||'-')}</td><td><button class="btn secondary" data-delete="${x.id}">Hapus</button></td></tr>`).join('')}</tbody></table>`;document.querySelectorAll('[data-stage]').forEach(e=>e.onchange=async()=>{const r=await sb.from('customer_pipeline').update({stage:e.value,updated_at:new Date().toISOString()}).eq('id',e.dataset.stage).eq('business_unit_id',active.id);if(r.error)notice(r.error.message,'err');else pipeline()});document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=async()=>{if(!confirm('Hapus pipeline ini?'))return;const r=await sb.from('customer_pipeline').delete().eq('id',e.dataset.delete).eq('business_unit_id',active.id);if(r.error)notice(r.error.message,'err');else pipeline()});notice('Pipeline berhasil dimuat.','ok')}$('form').onsubmit=async e=>{e.preventDefault();if(!active)return;const r=await sb.from('customer_pipeline').insert({business_unit_id:active.id,customer_id:$('customer').value,stage:$('stage').value,estimated_value:Number($('value').value||0),next_follow_up:$('follow').value||null,notes:$('notes').value||null});if(r.error)notice(r.error.message,'err');else{$('form').reset();notice('Pipeline berhasil ditambahkan.','ok');pipeline()}};$('refresh').onclick=()=>pipeline();$('unit').onchange=async()=>{const u=units.find(x=>x.id===$('unit').value);if(u){active=u;await window.ALJAVA_BUSINESS_CONTEXT.set(u.id);await Promise.all([customers(),pipeline()])}};window.addEventListener('aljava:business-changed',e=>{active=e.detail.businessUnit;Promise.all([customers(),pipeline()])});load().catch(e=>notice(e.message,'err'))})()</script></body></html>
