<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - ALJAVA TERIONITY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #168cff;
      --cyan: #25e4ff;
      --bg: #010713;
      --card: rgba(4, 25, 72, 0.82);
      --text: #ffffff;
      --muted: #9db7cc;
      --border: rgba(55, 210, 255, 0.35);
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        Poppins,
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(0, 132, 255, 0.32),
          transparent 40%
        ),
        radial-gradient(
          ellipse at 100% 30%,
          rgba(0, 225, 255, 0.14),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #010817 0%,
          #031b46 50%,
          #010713 100%
        );
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,0.8) 0 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(80,215,255,0.6) 0 1px,
          transparent 1.5px
        );

      background-size:
        97px 83px,
        151px 137px;

      background-position:
        8px 3px,
        31px 42px;

      opacity: 0.25;
    }

    .page {
      position: relative;
      z-index: 1;

      width: min(1200px, 100%);
      margin: 0 auto;

      padding: 25px 18px 50px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 25px;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 900;

      letter-spacing: 2.5px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #35e7ff,
          #168cff,
          #ffffff
        );

      background-size: 250% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation: shine 5s linear infinite;
    }

    .brand-sub {
      margin-top: 5px;

      color: var(--muted);

      font-size: 12px;
    }

    .logout-button {
      border:
        1px solid rgba(255,100,130,0.45);

      border-radius: 10px;

      padding: 10px 15px;

      color: #ffffff;

      background:
        rgba(180, 30, 70, 0.16);

      font-family: inherit;
      font-size: 12px;
      font-weight: 800;

      cursor: pointer;
    }

    .logout-button:hover {
      background:
        rgba(220, 40, 75, 0.28);
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin: 0 0 6px;

      font-size: 30px;
    }

    .welcome p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
    }

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;

      margin-bottom: 25px;
    }

    .stat-card {
      padding: 20px;

      border:
        1px solid var(--border);

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(4,25,72,0.78),
          rgba(1,8,35,0.9)
        );

      box-shadow:
        0 15px 40px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.05);

      backdrop-filter: blur(15px);
    }

    .stat-label {
      color: var(--muted);

      font-size: 12px;
    }

    .stat-number {
      margin-top: 8px;

      font-size: 30px;
      font-weight: 900;

      color: #35e7ff;
    }

    .table-card {
      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(4,25,72,0.82),
          rgba(1,8,35,0.94)
        );

      box-shadow:
        0 20px 60px rgba(0,0,0,0.4);

      backdrop-filter: blur(15px);
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding: 20px;

      border-bottom:
        1px solid rgba(55,180,255,0.2);
    }

    .table-header h2 {
      margin: 0;

      font-size: 19px;
    }

    .refresh-button {
      border:
        1px solid rgba(45,220,255,0.5);

      border-radius: 9px;

      padding: 9px 13px;

      color: #ffffff;

      background:
        rgba(0,130,255,0.15);

      font-family: inherit;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;
    }

    .refresh-button:hover {
      background:
        rgba(0,150,255,0.25);
    }

    .table-wrapper {
      width: 100%;

      overflow-x: auto;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 850px;
    }

    th {
      padding: 14px 16px;

      text-align: left;

      color: #bfefff;

      background:
        rgba(0,90,180,0.12);

      font-size: 11px;

      white-space: nowrap;
    }

    td {
      padding: 15px 16px;

      border-top:
        1px solid rgba(100,150,200,0.12);

      color: #e8f8ff;

      font-size: 12px;

      vertical-align: top;
    }

    tr:hover td {
      background:
        rgba(0,150,255,0.05);
    }

    .status {
      display: inline-block;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 10px;
      font-weight: 800;
    }

    .status-active {
      color: #caffff;

      background:
        rgba(0,210,255,0.12);

      border:
        1px solid rgba(50,225,255,0.35);
    }

    .status-pending {
      color: #ffe9b5;

      background:
        rgba(255,180,40,0.10);

      border:
        1px solid rgba(255,190,50,0.3);
    }

    .status-other {
      color: #ffdce4;

      background:
        rgba(220,40,75,0.10);

      border:
        1px solid rgba(255,90,120,0.3);
    }

    .review-link {
      color: #35e7ff;

      text-decoration: none;

      font-weight: 700;
    }

    .review-link:hover {
      text-decoration: underline;
    }

    .empty,
    .loading {
      padding: 45px 20px;

      text-align: center;

      font-size: 13px;
    }

    .empty {
      color: var(--muted);
    }

    .loading {
      color: #35e7ff;
    }

    .error {
      margin: 20px;

      padding: 14px;

      border:
        1px solid rgba(255,90,120,0.4);

      border-radius: 10px;

      background:
        rgba(220,40,75,0.10);

      color: #ffdce4;

      font-size: 12px;
    }

    footer {
      margin-top: 30px;

      text-align: center;

      color: #7792a7;

      font-size: 11px;
    }

    @keyframes shine {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 250% center;
      }
    }

    @media (max-width: 750px) {

      .page {
        padding:
          20px 12px 35px;
      }

      .topbar {
        align-items: flex-start;
      }

      .brand-name {
        font-size: 17px;
        letter-spacing: 2px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .welcome h1 {
        font-size: 25px;
      }
    }

    @media (max-width: 480px) {

      .topbar {
        flex-direction: column;
      }

      .logout-button {
        width: 100%;
      }

      .table-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .refresh-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="stars"></div>

  <main class="page">

    <header class="topbar">

      <div>

        <div class="brand-name">
          ALJAVA TERIONITY
        </div>

        <div class="brand-sub">
          Admin Dashboard
        </div>

      </div>

      <button
        class="logout-button"
        id="logoutButton"
      >
        Keluar
      </button>

    </header>


    <section class="welcome">

      <h1>
        Dashboard Admin
      </h1>

      <p id="adminEmail">
        Memuat akun...
      </p>

    </section>


    <section class="stats">

      <div class="stat-card">

        <div class="stat-label">
          Total Kartu
        </div>

        <div
          class="stat-number"
          id="totalCards"
        >
          -
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Kartu Aktif
        </div>

        <div
          class="stat-number"
          id="activeCards"
        >
          -
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Data Ditampilkan
        </div>

        <div
          class="stat-number"
          id="shownCards"
        >
          -
        </div>

      </div>

    </section>


    <section class="table-card">

      <div class="table-header">

        <h2>
          Data Kartu
        </h2>

        <button
          class="refresh-button"
          id="refreshButton"
        >
          ↻ Refresh
        </button>

      </div>


      <div id="tableContent">

        <div class="loading">
          Memuat data...
        </div>

      </div>

    </section>


    <footer>
      © 2026 ALJAVA TERIONITY • Digital Solution
    </footer>

  </main>


  <script>

    const SUPABASE_URL =
      "https://lbzwmcxwxummitldxucj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw";


    const accessToken =
      localStorage.getItem(
        "supabase_access_token"
      );


    const storedUser =
      localStorage.getItem(
        "supabase_user"
      );


    /*
     * =====================================================
     * CEK LOGIN
     * =====================================================
     */

    if (!accessToken) {

      window.location.href =
        "login.html";

    }


    /*
     * =====================================================
     * EMAIL ADMIN
     * =====================================================
     */

    if (storedUser) {

      try {

        const user =
          JSON.parse(storedUser);

        document.getElementById(
          "adminEmail"
        ).textContent =
          "Login sebagai: " +
          (
            user.email ||
            "Admin"
          );

      }
      catch (error) {

        document.getElementById(
          "adminEmail"
        ).textContent =
          "Admin";

      }

    }


    /*
     * =====================================================
     * LOAD DATA
     * =====================================================
     */

    async function loadCards() {

      const tableContent =
        document.getElementById(
          "tableContent"
        );


      tableContent.innerHTML =
        '<div class="loading">Memuat data...</div>';


      try {

        const response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/cards?select=*&order=card_code.asc",
            {
              method: "GET",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  accessToken,

                "Content-Type":
                  "application/json"
              }
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.hint ||
            "Gagal mengambil data."
          );

        }


        renderCards(data);

      }
      catch (error) {

        console.error(
          "LOAD CARDS ERROR:",
          error
        );


        tableContent.innerHTML =
          '<div class="error">' +
          "❌ Gagal mengambil data: " +
          escapeHtml(error.message) +
          "</div>";

      }

    }


    /*
     * =====================================================
     * RENDER
     * =====================================================
     */

    function renderCards(cards) {

      const tableContent =
        document.getElementById(
          "tableContent"
        );


      const total =
        cards.length;


      const active =
        cards.filter(
          function(card) {

            return (
              String(card.status)
                .toLowerCase() ===
              "active"
            );

          }
        ).length;


      document.getElementById(
        "totalCards"
      ).textContent =
        total;


      document.getElementById(
        "activeCards"
      ).textContent =
        active;


      document.getElementById(
        "shownCards"
      ).textContent =
        total;


      if (!cards.length) {

        tableContent.innerHTML =
          '<div class="empty">' +
          "Belum ada data kartu." +
          "</div>";

        return;

      }


      let html = "";

      html +=
        '<div class="table-wrapper">';

      html +=
        "<table>";

      html +=
        "<thead>";

      html +=
        "<tr>" +
        "<th>Kode Kartu</th>" +
        "<th>Nama Bisnis</th>" +
        "<th>Pemilik</th>" +
        "<th>WhatsApp</th>" +
        "<th>Status</th>" +
        "<th>Google Review</th>" +
        "</tr>";

      html +=
        "</thead>";

      html +=
        "<tbody>";


      cards.forEach(
        function(card) {

          const status =
            String(
              card.status ||
              "-"
            );


          let statusClass =
            "status-other";


          if (
            status.toLowerCase() ===
            "active"
          ) {

            statusClass =
              "status-active";

          }
          else if (
            status.toLowerCase() ===
            "pending"
          ) {

            statusClass =
              "status-pending";

          }


          const reviewUrl =
            card.google_review_url ||
            "";


          html +=
            "<tr>";


          html +=
            "<td>" +
            escapeHtml(
              card.card_code ||
              "-"
            ) +
            "</td>";


          html +=
            "<td>" +
            escapeHtml(
              card.business_name ||
              "-"
            ) +
            "</td>";


          html +=
            "<td>" +
            escapeHtml(
              card.owner_name ||
              "-"
            ) +
            "</td>";


          html +=
            "<td>" +
            escapeHtml(
              card.whatsapp ||
              "-"
            ) +
            "</td>";


          html +=
            "<td>" +
            '<span class="status ' +
            statusClass +
            '">' +
            escapeHtml(status) +
            "</span>" +
            "</td>";


          if (reviewUrl) {

            html +=
              "<td>" +
              '<a ' +
              'class="review-link" ' +
              'href="' +
              escapeAttribute(reviewUrl) +
              '" ' +
              'target="_blank" ' +
              'rel="noopener">' +
              "Buka Review" +
              "</a>" +
              "</td>";

          }
          else {

            html +=
              "<td>-</td>";

          }


          html +=
            "</tr>";

        }
      );


      html +=
        "</tbody>";

      html +=
        "</table>";

      html +=
        "</div>";


      tableContent.innerHTML =
        html;

    }


    /*
     * =====================================================
     * ESCAPE
     * =====================================================
     */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeAttribute(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    }


    /*
     * =====================================================
     * REFRESH
     * =====================================================
     */

    document
      .getElementById("refreshButton")
      .addEventListener(
        "click",
        loadCards
      );


    /*
     * =====================================================
     * LOGOUT
     * =====================================================
     */

    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        function() {

          localStorage.removeItem(
            "supabase_access_token"
          );

          localStorage.removeItem(
            "supabase_refresh_token"
          );

          localStorage.removeItem(
            "supabase_user"
          );


          window.location.href =
            "login.html";

        }
      );


    /*
     * =====================================================
     * JALANKAN
     * =====================================================
     */

    if (accessToken) {

      loadCards();

    }

  </script>

</body>
</html>
