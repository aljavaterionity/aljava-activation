<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALJAVA TERIONITY - Admin</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#17324d;font:14px Inter,Poppins,Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,rgba(115,220,255,.45),transparent 40%),radial-gradient(ellipse at 100% 30%,rgba(180,240,255,.55),transparent 30%),linear-gradient(180deg,#effcff,#dff6ff 50%,#c8efff)}.stars{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(60,190,235,.4) 0 1px,transparent 1.5px);background-size:97px 83px,151px 137px;opacity:.35}.page{position:relative;z-index:1;max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#0879b8,#35c9f2,#0879b8);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand 5s linear infinite}@keyframes brand{to{background-position:250% center}}.muted{color:#58788f;font-size:12px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,.field{border:1px solid rgba(39,163,211,.28);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.58);color:#17324d;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.btn{cursor:pointer;font-weight:800}.danger{border-color:rgba(190,65,90,.32);background:rgba(255,225,232,.72);color:#9b3047}.glass{border:1px solid rgba(55,180,225,.3);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(220,247,255,.48));margin-top:18px;overflow:hidden;box-shadow:0 20px 60px rgba(38,139,177,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.head{padding:18px;border-bottom:1px solid rgba(55,180,225,.15)}.body{padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:17px}.num{margin-top:7px;color:#0794d1;font-size:25px;font-weight:900}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.panel{display:none}.panel.on{display:block}.drawer{position:fixed;z-index:20;left:-310px;top:0;width:290px;height:100%;padding:20px;background:linear-gradient(180deg,rgba(235,251,255,.96),rgba(202,239,255,.96));border-right:1px solid #52c8eb;transition:.2s;box-shadow:12px 0 35px rgba(20,130,170,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.drawer.on{left:0}.drawer .btn{display:block;width:100%;margin:7px 0;text-align:left}.overlay{display:none;position:fixed;inset:0;background:rgba(20,90,120,.18);z-index:19}.overlay.on{display:block}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px;border-bottom:1px solid rgba(30,120,160,.1);text-align:left;font-size:12px}th{color:#247fa6}.active{color:#159b73}.inactive{color:#b57916}.expired{color:#c9435b}.form,.search{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.notice{padding:10px;margin-top:9px;border-radius:8px}.ok{background:rgba(50,190,150,.16)}.err{background:rgba(220,80,100,.13);color:#9b3047}.modal{display:none;position:fixed;z-index:50;inset:0;background:rgba(20,90,120,.22);place-items:center;padding:20px;backdrop-filter:blur(5px)}.modal.on{display:grid}.modalbox{width:min(500px,100%);padding:20px;background:rgba(239,251,255,.92);border:1px solid #55c8eb;border-radius:16px;box-shadow:0 25px 70px rgba(20,130,170,.2)}.modalbox .field{width:100%;margin-top:9px}.box{padding:16px;border:1px solid rgba(55,180,225,.22);border-radius:14px;background:rgba(255,255,255,.42)}.link{color:#0794d1;text-decoration:none;font-weight:800}.small{padding:7px 9px;font-size:10px}.cell-actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:800px){.stats,.grid,.form,.search{grid-template-columns:1fr}.page{padding:14px}.brand{font-size:18px}}</style></head><body>
