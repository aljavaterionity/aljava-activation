<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALJAVA TERIONITY • Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 45px;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      background: #010713;
    }

    /* =========================================
       BACKGROUND
       ========================================= */

    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 10%,
          rgba(0, 130, 255, 0.40),
          transparent 42%
        ),
        radial-gradient(
          ellipse at 90% 45%,
          rgba(0, 220, 255, 0.20),
          transparent 32%
        ),
        radial-gradient(
          ellipse at 10% 70%,
          rgba(0, 100, 255, 0.18),
          transparent 32%
        ),
        linear-gradient(
          180deg,
          #010817 0%,
          #031b46 48%,
          #010713 100%
        );
    }

    .stars {
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,0.9) 0 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(80,220,255,0.65) 0 1px,
          transparent 1.5px
        );

      background-size:
        97px 83px,
        151px 137px;

      background-position:
        8px 3px,
        31px 42px;

      opacity: 0.35;
    }

    .glow {
      position: absolute;
      width: 600px;
      height: 300px;
      left: 50%;
      bottom: -120px;
      transform: translateX(-50%);

      background:
        radial-gradient(
          ellipse,
          rgba(0,150,255,0.30),
          transparent 68%
        );

      filter: blur(35px);
    }

    /* =========================================
       CONTENT
       ========================================= */

    .container {
      position: relative;
      z-index: 2;

      width: min(100%, 1050px);
      margin: 0 auto;
    }

    /* =========================================
       HEADER
       ========================================= */

    .header {
      text-align: center;
      margin: 12px auto 30px;
      animation: fadeUp 0.6s ease both;
    }

    .brand {
      display: inline-block;

      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #3be6ff,
          #168cff,
          #ffffff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 20px rgba(0,190,255,0.20);
    }

    .brand-line {
      width: 55px;
      height: 3px;
      margin: 10px auto 12px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #00d9ff,
          #168cff,
          #35f4ff
        );

      box-shadow:
        0 0 14px rgba(0,200,255,0.7);
    }

    .subtitle {
      color: #bcd5e8;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    /* =========================================
       STATS
       ========================================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;

      margin-bottom: 22px;

      animation: fadeUp 0.7s ease both;
    }

    .stat {
      position: relative;
      overflow: hidden;

      padding: 22px;

      min-height: 125px;

      border-radius: 20px;

      border: 1px solid rgba(45,210,255,0.38);

      background:
        linear-gradient(
          145deg,
          rgba(5,30,80,0.88),
          rgba(1,10,38,0.94)
        );

      box-shadow:
        0 0 25px rgba(0,150,255,0.14),
        0 20px 45px rgba(0,0,0,0.35),
        inset 0 0 25px rgba(0,150,255,0.05);

      backdrop-filter: blur(15px);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .stat:hover {
      transform: translateY(-3px);

      border-color: rgba(50,225,255,0.70);

      box-shadow:
        0 0 30px rgba(0,170,255,0.24),
        0 20px 50px rgba(0,0,0,0.40);
    }

    .stat::after {
      content: "";

      position: absolute;

      width: 90px;
      height: 90px;

      right: -35px;
      bottom: -35px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,210,255,0.20),
          transparent 70%
        );

      filter: blur(8px);
    }

    .stat-title {
      position: relative;
      z-index: 1;

      color: #9ebbd0;
      font-size: 13px;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .stat-number {
      position: relative;
      z-index: 1;

      margin-top: 9px;

      font-size: 34px;
      line-height: 1;

      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #35ddff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 18px rgba(0,190,255,0.18);
    }

    .stat:nth-child(2) .stat-number {
      background:
        linear-gradient(
          90deg,
          #35ddff,
          #168cff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stat:nth-child(3) .stat-number {
      background:
        linear-gradient(
          90deg,
          #ffffff,
          #7ba8c9
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* =========================================
       TABLE CARD
       ========================================= */

    .card {
      padding: 24px;

      border-radius: 24px;

      border: 1px solid rgba(45,210,255,0.42);

      background:
        linear-gradient(
          145deg,
          rgba(4,25,70,0.94),
          rgba(1,8,32,0.97)
        );

      box-shadow:
        0 0 35px rgba(0,150,255,0.18),
        0 25px 70px rgba(0,0,0,0.55),
        inset 0 0 30px rgba(0,150,255,0.05);

      backdrop-filter: blur(18px);

      animation: fadeUp 0.8s ease both;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }

    .card-title {
      margin: 0;

      font-size: 21px;
      font-weight: 800;
    }

    .card-description {
      margin: 5px 0 0;

      color: #91b1c9;

      font-size: 13px;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;

      border-radius: 30px;

      border: 1px solid rgba(40,220,255,0.35);

      color: #6feaff;

      background: rgba(0,150,255,0.10);

      font-size: 11px;
      font-weight: 800;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #35eaff;

      box-shadow:
        0 0 10px #35eaff;
    }

    /* =========================================
       TABLE
       ========================================= */

    .table-wrapper {
      overflow-x: auto;

      border-radius: 16px;

      border: 1px solid rgba(60,110,160,0.25);
    }

    table {
      width: 100%;

      min-width: 650px;

      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px 16px;

      text-align: left;

      border-bottom:
        1px solid rgba(80,130,170,0.18);

      white-space: nowrap;
    }

    th {
      color: #77a8c6;

      background:
        rgba(4,22,55,0.75);

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.8px;
    }

    td {
      color: #e8f8ff;

      font-size: 14px;
    }

    tbody tr {
      transition: background 0.18s ease;
    }

    tbody tr:hover {
      background:
        rgba(0,160,255,0.07);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* =========================================
       STATUS
       ========================================= */

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 6px 11px;

      border-radius: 30px;

      font-size: 11px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 0.4px;
    }

    .status::before {
      content: "";

      width: 6px;
      height: 6px;

      border-radius: 50%;
    }

    .active {
      color: #73efff;

      background:
        rgba(0,210,255,0.10);

      border:
        1px solid rgba(0,220,255,0.28);
    }

    .active::before {
      background: #35eaff;

      box-shadow:
        0 0 8px #35eaff;
    }

    .inactive {
      color: #b9c7d4;

      background:
        rgba(120,150,175,0.10);

      border:
        1px solid rgba(120,150,175,0.25);
    }

    .inactive::before {
      background: #71879a;
    }

    /* =========================================
       FOOTER
       ========================================= */

    footer {
      margin-top: 25px;

      text-align: center;

      color: #7290a6;

      font-size: 11px;

      animation: fadeUp 1s ease both;
    }

    /* =========================================
       ANIMATION
       ========================================= */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 700px) {

      body {
        padding: 22px 12px 35px;
      }

      .header {
        margin-top: 8px;
        margin-bottom: 24px;
      }

      .brand {
        font-size: 23px;
        letter-spacing: 2.2px;
      }

      .subtitle {
        font-size: 12px;
      }

      .stats {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .stat {
        min-height: 105px;
        padding: 19px;
        border-radius: 18px;
      }

      .stat-number {
        font-size: 30px;
      }

      .card {
        padding: 18px 14px;

        border-radius: 21px;
      }

      .card-header {
        align-items: flex-start;
      }

      .card-title {
        font-size: 18px;
      }

      .card-description {
        font-size: 12px;
      }

      .live {
        font-size: 9px;
        padding: 6px 8px;
      }

      th,
      td {
        padding: 13px 12px;
      }
    }

    @media (max-width: 390px) {

      .live {
        display: none;
      }

      .brand {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       BACKGROUND
       ========================================= -->

  <div class="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="glow"></div>
  </div>


  <!-- =========================================
       MAIN
       ========================================= -->

  <main class="container">


    <!-- HEADER -->

    <header class="header">

      <div class="brand">
        ALJAVA TERIONITY
      </div>

      <div class="brand-line"></div>

      <div class="subtitle">
        Admin Dashboard • Google Review Card
      </div>

    </header>


    <!-- =========================================
         STATS
         ========================================= -->

    <section class="stats">

      <div class="stat">

        <div class="stat-title">
          Total Kartu
        </div>

        <div
          class="stat-number"
          id="totalCards"
        >
          -
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          Kartu Aktif
        </div>

        <div
          class="stat-number"
          id="activeCards"
        >
          -
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          Belum Aktif
        </div>

        <div
          class="stat-number"
          id="inactiveCards"
        >
          -
        </div>

      </div>

    </section>


    <!-- =========================================
         TABLE
         ========================================= -->

    <section class="card">

      <div class="card-header">

        <div>

          <h2 class="card-title">
            Daftar Kartu
          </h2>

          <p class="card-description">
            Pantau status kartu ALJAVA secara realtime.
          </p>

        </div>

        <div class="live">

          <span class="live-dot"></span>

          SYSTEM

        </div>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>Kode</th>
              <th>Status</th>
              <th>Produk</th>
              <th>Aktivasi</th>
            </tr>

          </thead>


          <tbody id="cardsTable">

            <tr>

              <td colspan="4">
                Memuat data...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>


    <!-- FOOTER -->

    <footer>
      © 2024 ALJAVA TERIONITY • Admin System
    </footer>

  </main>


  <!-- =========================================
       JAVASCRIPT
       FUNGSI BACKEND TETAP
       ========================================= -->

  <script>

    const SUPABASE_URL =
      "https://lbzwmcxwxummitldxucj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw";


    async function loadCards() {

      try {

        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/Cards?select=card_code,status,product_type,activated_at",
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );


        if (!response.ok) {

          throw new Error(
            "Gagal mengambil data kartu: " +
            response.status
          );

        }


        const cards =
          await response.json();


        /* TOTAL */

        document.getElementById(
          "totalCards"
        ).textContent =
          cards.length;


        /* ACTIVE */

        document.getElementById(
          "activeCards"
        ).textContent =
          cards.filter(function(card) {

            return card.status === "active";

          }).length;


        /* INACTIVE */

        document.getElementById(
          "inactiveCards"
        ).textContent =
          cards.filter(function(card) {

            return card.status === "inactive";

          }).length;


        /* TABLE */

        const table =
          document.getElementById(
            "cardsTable"
          );


        table.innerHTML = "";


        if (!cards.length) {

          table.innerHTML =
            "<tr>" +
              "<td colspan=\"4\" style=\"text-align:center;color:#8aa8bd;padding:30px;\">" +
                "Belum ada data kartu." +
              "</td>" +
            "</tr>";

          return;

        }


        cards.forEach(function(card) {

          const row =
            document.createElement("tr");


          const statusClass =
            card.status === "active"
              ? "active"
              : "inactive";


          let activated = "-";


          if (card.activated_at) {

            activated =
              new Date(
                card.activated_at
              ).toLocaleDateString(
                "id-ID"
              );

          }


          row.innerHTML =

            "<td>" +
              (card.card_code || "-") +
            "</td>" +

            "<td>" +

              "<span class=\"status " +
                statusClass +
              "\">" +

                (card.status || "-") +

              "</span>" +

            "</td>" +

            "<td>" +
              (card.product_type || "-") +
            "</td>" +

            "<td>" +
              activated +
            "</td>";


          table.appendChild(row);

        });


      } catch (error) {

        console.error(error);


        document.getElementById(
          "cardsTable"
        ).innerHTML =

          "<tr>" +

            "<td colspan=\"4\" style=\"color:#ff9eb1;padding:25px;\">" +

              "❌ " +
              error.message +

            "</td>" +

          "</tr>";

      }

    }


    loadCards();

  </script>

</body>
</html>
