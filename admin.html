<script>

const SUPABASE_URL =
  "https://lbzwmcxwxummitldxucj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw";


function rupiah(value) {
  return "Rp " + Number(value || 0).toLocaleString("id-ID");
}


async function loadRevenue() {

  try {

    const url =
      SUPABASE_URL +
      '/rest/v1/Transactions' +
      '?select=product_id,quantity,selling_price,hpp,commission,payment_status,transaction_date' +
      '&order=transaction_date.desc';

    const response = await fetch(url, {

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }

    });


    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(
        "Supabase error " +
        response.status +
        ": " +
        errorText
      );

    }


    const transactions = await response.json();


    let totalRevenue = 0;
    let totalHpp = 0;
    let totalCommission = 0;


    transactions.forEach(function(tx) {

      const quantity =
        Number(tx.quantity) || 0;

      const sellingPrice =
        Number(tx.selling_price) || 0;

      const hpp =
        Number(tx.hpp) || 0;

      const commission =
        Number(tx.commission) || 0;


      totalRevenue +=
        sellingPrice * quantity;

      totalHpp +=
        hpp * quantity;

      totalCommission +=
        commission;

    });


    const netProfit =
      totalRevenue -
      totalHpp -
      totalCommission;


    document.getElementById("totalRevenue").textContent =
      rupiah(totalRevenue);

    document.getElementById("mainRevenue").textContent =
      rupiah(totalRevenue);

    document.getElementById("totalHpp").textContent =
      rupiah(totalHpp);

    document.getElementById("totalCommission").textContent =
      rupiah(totalCommission);

    document.getElementById("totalTransactions").textContent =
      transactions.length;

    document.getElementById("netProfit").textContent =
      rupiah(netProfit);


    renderTransactions(transactions);


  } catch (error) {

    console.error(error);

    document.getElementById("transactionsTable").innerHTML =

      "<tr>" +
        "<td colspan='8' style='color:#ff9eb1;padding:25px'>" +
          "❌ " + error.message +
        "</td>" +
      "</tr>";

  }

}


function renderTransactions(transactions) {

  const table =
    document.getElementById("transactionsTable");


  if (!transactions.length) {

    table.innerHTML =

      "<tr>" +
        "<td colspan='8' style='text-align:center;color:#8aa8bd;padding:35px'>" +
          "Belum ada transaksi." +
        "</td>" +
      "</tr>";

    return;

  }


  table.innerHTML = "";


  transactions.forEach(function(tx) {

    const quantity =
      Number(tx.quantity) || 0;

    const sellingPrice =
      Number(tx.selling_price) || 0;

    const hpp =
      Number(tx.hpp) || 0;

    const commission =
      Number(tx.commission) || 0;


    const revenue =
      sellingPrice * quantity;

    const totalHpp =
      hpp * quantity;

    const profit =
      revenue -
      totalHpp -
      commission;


    const date =
      tx.transaction_date
        ? new Date(tx.transaction_date)
            .toLocaleDateString("id-ID")
        : "-";


    const status =
      tx.payment_status || "-";


    let statusClass = "other";


    if (status.toLowerCase() === "paid") {
      statusClass = "paid";
    }

    else if (status.toLowerCase() === "pending") {
      statusClass = "pending";
    }


    const row =
      document.createElement("tr");


    row.innerHTML =

      "<td>" +
        date +
      "</td>" +

      "<td>" +
        (tx.product_id || "-") +
      "</td>" +

      "<td>" +
        quantity +
      "</td>" +

      "<td>" +
        rupiah(revenue) +
      "</td>" +

      "<td>" +
        rupiah(totalHpp) +
      "</td>" +

      "<td>" +
        rupiah(commission) +
      "</td>" +

      "<td>" +
        rupiah(profit) +
      "</td>" +

      "<td>" +
        "<span class='status " +
          statusClass +
        "'>" +
          status +
        "</span>" +
      "</td>";


    table.appendChild(row);

  });

}


loadRevenue();


setInterval(
  loadRevenue,
  30000
);

</script>
