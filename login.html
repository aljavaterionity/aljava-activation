<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#effcff">
<title>Login - ALJAVA TERIONITY</title>
<style>
*{box-sizing:border-box}:root{--blue:#168cff;--cyan:#35c9f2;--bg:#effcff;--text:#17324d;--muted:#58788f;--line:rgba(39,163,211,.28)}html,body{min-height:100%}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,Poppins,Arial,Helvetica,sans-serif;color:var(--text);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,rgba(115,220,255,.48),transparent 40%),radial-gradient(ellipse at 100% 30%,rgba(180,240,255,.55),transparent 30%),linear-gradient(180deg,#effcff,#dff6ff 50%,#c8efff)}.stars{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(60,190,235,.4) 0 1px,transparent 1.5px);background-size:97px 83px,151px 137px;background-position:8px 3px,31px 42px;opacity:.35}.glow{position:fixed;width:500px;height:500px;right:-180px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(90,220,255,.4),rgba(40,170,220,.14) 40%,transparent 70%);filter:blur(10px);pointer-events:none}.login-container{position:relative;z-index:2;width:min(100%,420px);animation:loginIn .8s ease both}.brand{text-align:center;margin-bottom:25px}.brand-name{display:inline-block;font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#0879b8,#35c9f2,#0879b8);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand 5s linear infinite}.brand-line{width:55px;height:2px;margin:8px auto 0;border-radius:999px;background:linear-gradient(90deg,transparent,#35c9f2,transparent);box-shadow:0 0 12px rgba(37,200,240,.55)}.login-card{padding:30px;border:1px solid rgba(55,180,225,.3);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.74),rgba(220,247,255,.5));box-shadow:0 20px 60px rgba(38,139,177,.18),inset 0 1px 0 rgba(255,255,255,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.login-title{margin:0;text-align:center;font-size:28px;font-weight:850;letter-spacing:-.5px}.login-title span{background:linear-gradient(90deg,#0879b8,#168cff,#25bfe8);-webkit-background-clip:text;background-clip:text;color:transparent}.login-subtitle{margin:10px 0 25px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.form-group{margin-bottom:17px}label{display:block;margin-bottom:7px;color:#247fa6;font-size:12px;font-weight:800}input{width:100%;height:50px;padding:0 14px;border:1px solid rgba(39,163,211,.28);border-radius:10px;outline:none;color:#17324d;background:rgba(255,255,255,.58);font-family:inherit;font-size:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.2s ease}input::placeholder{color:#7893a5}input:hover{border-color:rgba(39,163,211,.5)}input:focus{border-color:#25bfe8;background:rgba(255,255,255,.78);box-shadow:0 0 0 3px rgba(0,170,220,.1),0 0 20px rgba(0,170,220,.14)}.login-button{width:100%;height:50px;margin-top:5px;border:1px solid rgba(55,190,230,.45);border-radius:10px;color:#fff;background:linear-gradient(90deg,#0757c9,#168cff,#25dfff);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 25px rgba(0,140,255,.22);transition:.2s ease}.login-button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,180,255,.3);filter:brightness(1.04)}.login-button:disabled{opacity:.6;cursor:not-allowed;transform:none}.error-box,.success-box{display:none;margin-bottom:15px;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.5}.error-box{border:1px solid rgba(190,65,90,.32);background:rgba(255,225,232,.72);color:#9b3047}.success-box{border:1px solid rgba(50,190,150,.3);background:rgba(50,190,150,.14);color:#17785e}.footer{margin-top:20px;text-align:center;color:#6f899c;font-size:11px}@keyframes loginIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes brand{to{background-position:250% center}}@media(max-width:480px){.login-card{padding:24px 18px;border-radius:18px}.brand-name{font-size:18px;letter-spacing:2px}.login-title{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars"></div><div class="glow"></div>
<main class="login-container">
<div class="brand"><div class="brand-name">ALJAVA TERIONITY</div><div class="brand-line"></div></div>
<section class="login-card">
<h1 class="login-title">Login <span>Dashboard</span></h1>
<p class="login-subtitle">Masuk untuk mengakses Dashboard ALJAVA TERIONITY.</p>
<div id="errorBox" class="error-box"></div><div id="successBox" class="success-box"></div>
<form id="loginForm"><div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="Masukkan email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required></div><button type="submit" class="login-button" id="loginButton">Masuk</button></form>
</section>
<div class="footer">© 2026 ALJAVA TERIONITY • Digital Solution</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/app-config.js"></script>
<script>
const config=window.ALJAVA_CONFIG;
const supabaseClient=window.__ALJAVA_SUPABASE_CLIENT||null;
const loginForm=document.getElementById('loginForm');
const loginButton=document.getElementById('loginButton');
const errorBox=document.getElementById('errorBox');
const successBox=document.getElementById('successBox');
function setError(message){errorBox.textContent='❌ '+message;errorBox.style.display='block'}
async function confirmAccess(){
  if(!config||!supabaseClient)throw new Error('Library Supabase gagal dimuat. Muat ulang halaman.');
  const {data:{user}={},error:userError}=await supabaseClient.auth.getUser();
  if(userError||!user)throw new Error('Sesi login tidak valid.');
  const admin=await supabaseClient.rpc('is_admin_user');
  if(admin.error)throw new Error('Gagal memeriksa hak admin.');
  if(admin.data===true)return user;
  const memberships=await supabaseClient.rpc('get_my_business_units');
  if(memberships.error)throw new Error('Gagal memeriksa akses Business Unit.');
  if(!Array.isArray(memberships.data)||memberships.data.length===0){
    await supabaseClient.auth.signOut({scope:'local'});
    throw new Error('Akun ini belum memiliki akses Business Unit.');
  }
  return user;
}
async function redirectIfSession(){
  if(!supabaseClient)return;
  const {data:{session}={}}=await supabaseClient.auth.getSession();
  if(!session)return;
  try{await confirmAccess();window.location.replace('/dashboard-hub.html')}
  catch(error){console.warn('Session tidak dapat digunakan:',error)}
}
loginForm.addEventListener('submit',async event=>{
  event.preventDefault();errorBox.style.display='none';successBox.style.display='none';loginButton.disabled=true;loginButton.textContent='Memproses...';
  try{
    if(!supabaseClient)throw new Error('Library Supabase gagal dimuat. Muat ulang halaman.');
    const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
    if(error)throw error;
    await confirmAccess();
    successBox.textContent='Login berhasil. Mengalihkan...';successBox.style.display='block';
    setTimeout(()=>window.location.replace('/dashboard-hub.html'),500);
  }catch(error){console.error('LOGIN ERROR:',error);setError(error.message||'Login gagal.');loginButton.disabled=false;loginButton.textContent='Masuk'}
});
void redirectIfSession();
</script>
</body>
</html>
