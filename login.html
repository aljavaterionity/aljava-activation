<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Login - ALJAVA TERIONITY</title>
<style>
*{box-sizing:border-box}:root{--blue:#168cff;--cyan:#35c9f2;--bg:#080808;--text:#f5f5f5;--muted:#a1a1aa;--line:#2a2a2a}html,body{min-height:100%}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,Poppins,Arial,Helvetica,sans-serif;color:var(--text);overflow:hidden;background:#080808}.stars{display:none}.glow{position:fixed;width:500px;height:500px;right:-180px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.10),rgba(34,211,238,.04) 40%,transparent 70%);filter:blur(18px);pointer-events:none}.login-container{position:relative;z-index:2;width:min(100%,420px);animation:loginIn .8s ease both}.brand{text-align:center;margin-bottom:25px}.brand-name{display:inline-block;font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#60a5fa,#22d3ee,#3b82f6);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand 5s linear infinite}.brand-line{width:55px;height:2px;margin:8px auto 0;border-radius:999px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);box-shadow:0 0 12px rgba(34,211,238,.22)}.login-card{padding:30px;border:1px solid #292929;border-radius:20px;background:#111;box-shadow:0 25px 70px rgba(0,0,0,.5)}.login-title{margin:0;text-align:center;font-size:28px;font-weight:850;letter-spacing:-.5px;color:#f5f5f5}.login-title span{background:linear-gradient(90deg,#60a5fa,#22d3ee,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}.login-subtitle{margin:10px 0 25px;text-align:center;color:#a1a1aa;font-size:13px;line-height:1.6}.form-group{margin-bottom:17px}label{display:block;margin-bottom:7px;color:#93c5fd;font-size:12px;font-weight:800}input{width:100%;height:50px;padding:0 14px;border:1px solid #2a2a2a;border-radius:10px;outline:none;color:#f5f5f5;background:#111;font-family:inherit;font-size:14px;transition:.2s ease}input::placeholder{color:#71717a}input:hover{border-color:#3b3b3b}input:focus{border-color:#3b82f6;background:#141414;box-shadow:0 0 0 3px rgba(59,130,246,.12)}.login-button{width:100%;height:50px;margin-top:5px;border:1px solid #3b82f6;border-radius:10px;color:#fff;background:linear-gradient(90deg,#2563eb,#0891b2);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 25px rgba(37,99,235,.2);transition:.2s ease}.login-button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px rgba(37,99,235,.25);filter:brightness(1.05)}.login-button:disabled{opacity:.6;cursor:not-allowed;transform:none}.error-box,.success-box{display:none;margin-bottom:15px;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.5}.error-box{border:1px solid rgba(239,68,68,.2);background:rgba(239,68,68,.09);color:#fca5a5}.success-box{border:1px solid rgba(16,185,129,.2);background:rgba(16,185,129,.09);color:#6ee7b7}.footer{margin-top:20px;text-align:center;color:#71717a;font-size:11px}@keyframes loginIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes brand{to{background-position:250% center}}@media(max-width:480px){.login-card{padding:24px 18px;border-radius:18px}.brand-name{font-size:18px;letter-spacing:2px}.login-title{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars"></div><div class="glow"></div>
<main class="login-container"><div class="brand"><div class="brand-name">ALJAVA TERIONITY</div><div class="brand-line"></div></div><section class="login-card"><h1 class="login-title">Login <span>Dashboard</span></h1><p class="login-subtitle">Masuk untuk mengakses Dashboard ALJAVA TERIONITY.</p><div id="errorBox" class="error-box"></div><div id="successBox" class="success-box"></div><form id="loginForm"><div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="Masukkan email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required></div><button type="submit" class="login-button" id="loginButton">Masuk</button></form></section><div class="footer">© 2026 ALJAVA TERIONITY • Digital Solution</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/app-config.js"></script>
<script>
const supabaseClient=window.ALJAVA_CORE?.supabase||null;
const loginForm=document.getElementById('loginForm');
const loginButton=document.getElementById('loginButton');
const errorBox=document.getElementById('errorBox');
const successBox=document.getElementById('successBox');
function setError(message){errorBox.textContent='❌ '+message;errorBox.style.display='block'}
async function confirmAdminSession(){
 if(!supabaseClient)throw new Error('Library Supabase gagal dimuat. Muat ulang halaman.');
 const {data:{user}={},error:userError}=await supabaseClient.auth.getUser();
 if(userError||!user)throw new Error('Sesi login tidak valid.');
 const {data:isAdmin,error:adminError}=await supabaseClient.rpc('is_admin_user');
 if(adminError)throw new Error('Gagal memeriksa hak admin.');
 if(isAdmin!==true){await supabaseClient.auth.signOut({scope:'local'});throw new Error('Akun ini tidak memiliki akses admin.')}
 return user;
}
async function redirectIfAdminSession(){
 if(!supabaseClient)return;
 const {data:{session}={}}=await supabaseClient.auth.getSession();
 if(!session)return;
 try{await confirmAdminSession();window.location.replace('/admin.html')}catch(error){console.warn('Session admin tidak dapat digunakan:',error)}
}
loginForm.addEventListener('submit',async(event)=>{
 event.preventDefault();errorBox.style.display='none';successBox.style.display='none';
 const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;
 loginButton.disabled=true;loginButton.textContent='Memproses...';
 try{if(!supabaseClient)throw new Error('Library Supabase gagal dimuat. Muat ulang halaman.');const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await confirmAdminSession();successBox.textContent='Login berhasil. Mengalihkan...';successBox.style.display='block';setTimeout(()=>window.location.replace('/admin.html'),500)}
 catch(error){console.error('LOGIN ERROR:',error);setError(error.message||'Login gagal.');loginButton.disabled=false;loginButton.textContent='Masuk'}
});
void redirectIfAdminSession();
</script>
</body>
</html>
