<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aktivasi Kartu ALJAVA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(0, 140, 255, 0.25), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(0, 90, 255, 0.20), transparent 30%),
        linear-gradient(135deg, #020617, #071a38 50%, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.96);
      padding: 32px 26px;
      border-radius: 28px;
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.35),
        0 0 40px rgba(0, 130, 255, 0.10);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .brand {
      text-align: center;
      margin-bottom: 8px;
    }

    .brand img {
      width: 150px;
      max-width: 70%;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .activation-title {
      text-align: center;
      color: #0f172a;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .description {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 auto 26px;
      max-width: 340px;
    }

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #dbe3ef;
      border-radius: 13px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #1683ff;
      box-shadow: 0 0 0 4px rgba(22, 131, 255, 0.10);
    }

    #card_code {
      background: #f1f7ff;
      border-color: #c9def7;
      color: #0759a8;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding-right: 48px;
    }

    .lock {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #0878ed, #0757c9);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 10px 25px rgba(7, 87, 201, 0.25);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(7, 87, 201, 0.32);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .notice {
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.5;
      color: #94a3b8;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 20px 16px;
      border-radius: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    .success {
      background: linear-gradient(
        135deg,
        #ecfdf5,
        #f0fdf4
      );
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .error {
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }

    .success-icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .success-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .success-text {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
    }

    .review-button {
      display: none;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: #0f172a;
      color: white;
      padding: 15px;
      border-radius: 14px;
      margin-top: 14px;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .review-button:hover {
      transform: translateY(-2px);
      background: #020617;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      .container {
        padding: 27px 19px;
        border-radius: 23px;
      }

      .brand img {
        width: 130px;
      }

      .activation-title {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <img
        src="logo-aljava.png"
        alt="ALJAVA TERIONITY"
      >
    </div>

    <div class="subtitle">
      Google Review Card
    </div>

    <div class="activation-title">
      Aktivasi Kartu
    </div>

    <div class="description">
      Aktifkan kartu Anda dan hubungkan langsung
      ke halaman Google Review bisnis Anda.
    </div>

    <form id="activationForm">

      <label for="card_code">
        Kode Kartu
      </label>

      <div class="input-wrapper">
        <input
          type="text"
          id="card_code"
          placeholder="Kode kartu"
          readonly
          required
        >

        <span class="lock">
          🔒
        </span>
      </div>

      <label for="business_name">
        Nama Bisnis
      </label>

      <input
        type="text"
        id="business_name"
        placeholder="Contoh: Kopi Alpin"
        required
      >

      <label for="owner_name">
        Nama Pemilik
      </label>

      <input
        type="text"
        id="owner_name"
        placeholder="Nama pemilik"
        required
      >

      <label for="whatsapp">
        WhatsApp
      </label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="08123456789"
        required
      >

      <label for="google_review_url">
        Link Google Review
      </label>

      <input
        type="url"
        id="google_review_url"
        placeholder="https://g.page/r/..."
        required
      >

      <button
        type="submit"
        id="submitButton"
      >
        Aktifkan Kartu
      </button>

      <div class="notice">
        Dengan mengaktifkan kartu, data bisnis Anda akan
        tersimpan di sistem ALJAVA.
      </div>

    </form>

    <div id="message"></div>

    <a
      id="reviewButton"
      class="review-button"
      href="#"
      target="_blank"
      rel="noopener"
    >
      ⭐ Buka Google Review
    </a>

    <div class="footer">
      ALJAVA TERIONITY • Digital Solution
    </div>

  </div>


<script>

const FUNCTION_URL =
  "https://lbzwmcxwxummitldxucj.supabase.co/functions/v1/activate-card";

const CHECK_FUNCTION_URL =
  "https://lbzwmcxwxummitldxucj.supabase.co/functions/v1/check_card";

const urlParams =
  new URLSearchParams(window.location.search);

const cardCode =
  urlParams.get("code");


if (cardCode) {

  document
    .getElementById("card_code")
    .value = cardCode;

}


async function checkCardStatus() {

  if (!cardCode) return;

  try {

    const response =
      await fetch(
        CHECK_FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": "sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw",
            "Authorization": "Bearer sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw"
          },

          body: JSON.stringify({
            card_code: cardCode
          })
        }
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal mengecek kartu."
      );

    }


    if (
      result.status === "active"
    ) {

      window.location.href =
        result.google_review_url;

      return;

    }

  } catch (error) {

    console.error(error);

  }

}


checkCardStatus();


document
  .getElementById("activationForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const button =
        document.getElementById(
          "submitButton"
        );

      const message =
        document.getElementById(
          "message"
        );

      const reviewButton =
        document.getElementById(
          "reviewButton"
        );


      button.disabled = true;

      button.innerText =
        "Mengaktifkan...";


      message.style.display =
        "none";

      reviewButton.style.display =
        "none";


      const data = {

        card_code:
          document
            .getElementById("card_code")
            .value
            .trim(),

        business_name:
          document
            .getElementById("business_name")
            .value
            .trim(),

        owner_name:
          document
            .getElementById("owner_name")
            .value
            .trim(),

        whatsapp:
          document
            .getElementById("whatsapp")
            .value
            .trim(),

        google_review_url:
          document
            .getElementById(
              "google_review_url"
            )
            .value
            .trim()

      };


      try {

        const response =
          await fetch(
            FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey": "sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw",
                "Authorization": "Bearer sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw"
              },

              body: JSON.stringify(data)
            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Aktivasi gagal."
          );

        }


        message.className =
          "success";

        message.style.display =
          "block";


        message.innerHTML = `

          <div class="success-icon">
            🎉
          </div>

          <div class="success-title">
            Kartu Berhasil Diaktifkan
          </div>

          <div class="success-text">
            Kartu Anda sudah siap digunakan
            untuk Google Review.
          </div>

        `;


        reviewButton.href =
          result.google_review_url;


        reviewButton.style.display =
          "block";


        document
          .getElementById(
            "activationForm"
          )
          .reset();

      }


      catch (error) {

        message.className =
          "error";

        message.style.display =
          "block";

        message.innerText =
          "❌ " + error.message;

      }


      button.disabled = false;

      button.innerText =
        "Aktifkan Kartu";

    }
  );

</script>

</body>
</html>
