<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aktivasi Kartu - ALJAVA TERIONITY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #168cff;
      --cyan: #25e4ff;
      --bg: #010713;
      --text: #ffffff;
      --muted: #9db7cc;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Inter,
        Poppins,
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          ellipse at 50% 10%,
          rgba(0, 132, 255, 0.38),
          transparent 42%
        ),
        radial-gradient(
          ellipse at 85% 35%,
          rgba(0, 225, 255, 0.18),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #010817 0%,
          #031b46 48%,
          #010713 100%
        );

      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,0.85) 0 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(80,215,255,0.7) 0 1px,
          transparent 1.5px
        );

      background-size:
        97px 83px,
        151px 137px;

      background-position:
        8px 3px,
        31px 42px;

      opacity: 0.38;
    }

    .glow {
      position: fixed;

      width: 500px;
      height: 500px;

      right: -180px;
      top: -100px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,210,255,0.35),
          rgba(0,140,255,0.12) 40%,
          transparent 70%
        );

      filter: blur(10px);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;

      width: min(100%, 500px);

      animation: loginIn 0.8s ease both;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-name {
      display: inline-block;

      font-size: 20px;
      font-weight: 900;

      letter-spacing: 3px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #35e7ff,
          #168cff,
          #ffffff
        );

      background-size: 250% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation: shine 5s linear infinite;
    }

    .brand-line {
      width: 55px;
      height: 2px;

      margin: 8px auto 0;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #25e4ff,
          transparent
        );

      box-shadow:
        0 0 12px rgba(37,228,255,0.7);
    }

    .card {
      padding: 30px;

      border-radius: 24px;

      border:
        1px solid rgba(55,210,255,0.55);

      background:
        linear-gradient(
          145deg,
          rgba(4,25,72,0.84),
          rgba(1,8,35,0.95)
        );

      box-shadow:
        0 0 35px rgba(0,160,255,0.22),
        0 25px 75px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.06);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;

      text-align: center;

      font-size: 28px;
      font-weight: 850;
    }

    h1 span {
      background:
        linear-gradient(
          90deg,
          #34dfff,
          #168cff,
          #00e5ff
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .subtitle {
      margin: 10px 0 25px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #bfefff;

      font-size: 12px;
      font-weight: 750;
    }

    input {
      width: 100%;
      height: 50px;

      padding: 0 14px;

      border:
        1px solid rgba(100,145,190,0.45);

      border-radius: 12px;

      outline: none;

      color: #ffffff;

      background:
        rgba(5,20,54,0.9);

      font-family: inherit;
      font-size: 14px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #637f96;
    }

    input:focus {
      border-color: #25ddff;

      box-shadow:
        0 0 0 3px rgba(0,190,255,0.10),
        0 0 20px rgba(0,170,255,0.18);
    }

    .button {
      width: 100%;
      height: 50px;

      margin-top: 5px;

      border: 0;
      border-radius: 12px;

      color: #ffffff;

      background:
        linear-gradient(
          90deg,
          #0757c9,
          #168cff,
          #25dfff
        );

      font-family: inherit;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(0,140,255,0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(0,180,255,0.35);
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;

      margin-bottom: 15px;
      padding: 12px 14px;

      border-radius: 10px;

      font-size: 12px;
      line-height: 1.5;
    }

    .error {
      border:
        1px solid rgba(255,90,120,0.4);

      background:
        rgba(220,40,75,0.10);

      color: #ffdce4;
    }

    .success {
      border:
        1px solid rgba(50,230,255,0.4);

      background:
        rgba(0,210,255,0.10);

      color: #bffcff;
    }

    .result {
      display: none;

      margin-top: 20px;

      padding: 18px;

      border-radius: 14px;

      border:
        1px solid rgba(50,230,255,0.35);

      background:
        rgba(0,150,255,0.08);

      text-align: center;
    }

    .result-title {
      color: #9db7cc;
      font-size: 11px;
    }

    .card-code {
      margin-top: 6px;

      color: #35e7ff;

      font-size: 25px;
      font-weight: 900;

      letter-spacing: 2px;
    }

    .footer {
      margin-top: 20px;

      text-align: center;

      color: #7792a7;

      font-size: 11px;
    }

    @keyframes loginIn {
      from {
        opacity: 0;
        transform:
          translateY(20px)
          scale(0.98);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes shine {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 250% center;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px 18px;
        border-radius: 21px;
      }

      .brand-name {
        font-size: 17px;
        letter-spacing: 2.4px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="stars"></div>
  <div class="glow"></div>

  <main class="container">

    <div class="brand">
      <div class="brand-name">
        ALJAVA TERIONITY
      </div>

      <div class="brand-line"></div>
    </div>

    <section class="card">

      <h1>
        Aktivasi <span>Kartu</span>
      </h1>

      <p class="subtitle">
        Isi data bisnis untuk membuat kartu digital ALJAVA TERIONITY.
      </p>

      <div
        id="errorBox"
        class="message error"
      ></div>

      <div
        id="successBox"
        class="message success"
      ></div>

      <form id="activationForm">

        <div class="form-group">
          <label for="businessName">
            Nama Bisnis
          </label>

          <input
            type="text"
            id="businessName"
            placeholder="Contoh: ALJAVA TERIONITY"
            required
          >
        </div>

        <div class="form-group">
          <label for="ownerName">
            Nama Pemilik
          </label>

          <input
            type="text"
            id="ownerName"
            placeholder="Masukkan nama pemilik"
            required
          >
        </div>

        <div class="form-group">
          <label for="whatsapp">
            WhatsApp
          </label>

          <input
            type="tel"
            id="whatsapp"
            placeholder="Contoh: 081234567890"
            required
          >
        </div>

        <div class="form-group">
          <label for="reviewUrl">
            Link Google Review
          </label>

          <input
            type="url"
            id="reviewUrl"
            placeholder="https://g.page/..."
          >
        </div>

        <button
          type="submit"
          class="button"
          id="submitButton"
        >
          Aktifkan Kartu
        </button>

      </form>

      <div
        id="resultBox"
        class="result"
      >
        <div class="result-title">
          Kartu berhasil dibuat
        </div>

        <div
          id="cardCode"
          class="card-code"
        ></div>
      </div>

    </section>

    <div class="footer">
      © 2026 ALJAVA TERIONITY • Digital Solution
    </div>

  </main>

  <script>

    /*
     * =====================================================
     * SUPABASE
     * =====================================================
     */

    const SUPABASE_URL =
      "https://lbzwmcxwxummitldxucj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw";


    /*
     * =====================================================
     * ELEMENT
     * =====================================================
     */

    const form =
      document.getElementById("activationForm");

    const submitButton =
      document.getElementById("submitButton");

    const errorBox =
      document.getElementById("errorBox");

    const successBox =
      document.getElementById("successBox");

    const resultBox =
      document.getElementById("resultBox");

    const cardCodeElement =
      document.getElementById("cardCode");


    /*
     * =====================================================
     * GENERATE KODE KARTU
     * =====================================================
     */

    function generateCardCode() {

      const random =
        Math.floor(
          1000 +
          Math.random() * 9000
        );

      return "ALJ-" + random;

    }


    /*
     * =====================================================
     * AKTIVASI
     * =====================================================
     */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        errorBox.style.display = "none";
        successBox.style.display = "none";
        resultBox.style.display = "none";

        const businessName =
          document
            .getElementById("businessName")
            .value
            .trim();

        const ownerName =
          document
            .getElementById("ownerName")
            .value
            .trim();

        const whatsapp =
          document
            .getElementById("whatsapp")
            .value
            .trim();

        const reviewUrl =
          document
            .getElementById("reviewUrl")
            .value
            .trim();

        const cardCode =
          generateCardCode();


        submitButton.disabled = true;
        submitButton.textContent =
          "Menyimpan...";


        try {

          const response =
            await fetch(
              SUPABASE_URL +
              "/rest/v1/cards",
              {
                method: "POST",

                headers: {
                  "apikey": SUPABASE_KEY,

                  "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                  "Content-Type":
                    "application/json",

                  "Prefer":
                    "return=representation"
                },

                body: JSON.stringify({
                  card_code: cardCode,
                  business_name: businessName,
                  owner_name: ownerName,
                  whatsapp: whatsapp,
                  status: "active",
                  google_review_url: reviewUrl || null
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              data.hint ||
              data.details ||
              "Gagal menyimpan kartu."
            );

          }


          successBox.textContent =
            "✅ Kartu berhasil diaktifkan dan sudah masuk ke Dashboard Admin.";

          successBox.style.display =
            "block";


          cardCodeElement.textContent =
            cardCode;

          resultBox.style.display =
            "block";


          form.reset();


        }
        catch (error) {

          console.error(
            "ACTIVATION ERROR:",
            error
          );

          errorBox.textContent =
            "❌ " +
            error.message;

          errorBox.style.display =
            "block";

        }
        finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Aktifkan Kartu";

        }

      }
    );

  </script>

</body>
</html>
