<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aktivasi Kartu ALJAVA</title>

  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111111, #2b2b2b);
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 430px;
  background: #ffffff;
  padding: 30px 25px;
  border-radius: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #111111;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  color: #777777;
  font-size: 14px;
  margin-bottom: 28px;
}

label {
  display: block;
  margin-top: 17px;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 700;
  color: #222222;
}

input {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid #dddddd;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  transition: 0.2s;
}

input:focus {
  border-color: #111111;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
}

#card_code {
  background: #f3f3f3;
  color: #555555;
  font-weight: bold;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #111111;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-1px);
  opacity: 0.9;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#message {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
}

.success {
  background: #e9f8ee;
  color: #17723a;
}

.error {
  background: #ffecec;
  color: #a00000;
}

.review-button {
  display: none;
  width: 100%;
  text-align: center;
  text-decoration: none;
  background: #111111;
  color: white;
  padding: 14px;
  border-radius: 12px;
  margin-top: 15px;
  font-weight: bold;
}

@media (max-width: 480px) {
  body {
    padding: 14px;
  }

  .container {
    padding: 25px 20px;
    border-radius: 20px;
  }

  .logo {
    font-size: 28px;
  }
}
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ALJAVA
    </div>

    <div class="subtitle">
      Aktivasi Kartu Google Review
    </div>

    <form id="activationForm">

      <label for="card_code">Kode Kartu</label>

     <input
  type="text"
  id="card_code"
  placeholder="Kode kartu"
  readonly
  required

      <label for="business_name">Nama Bisnis</label>

      <input
        type="text"
        id="business_name"
        placeholder="Contoh: Kopi Alpin"
        required
      >

      <label for="owner_name">Nama Pemilik</label>

      <input
        type="text"
        id="owner_name"
        placeholder="Nama pemilik"
        required
      >

      <label for="whatsapp">WhatsApp</label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="08123456789"
        required
      >

      <label for="google_review_url">
        Link Google Review
      </label>

      <input
        type="url"
        id="google_review_url"
        placeholder="https://g.page/r/..."
        required
      >

      <button type="submit" id="submitButton">
        Aktifkan Kartu
      </button>

    </form>

    <div id="message"></div>

    <a
      id="reviewButton"
      class="review-button"
      href="#"
      target="_blank"
    >
      Buka Google Review
    </a>

  </div>

<script>

const FUNCTION_URL =
  "https://lbzwmcxwxummitldxucj.supabase.co/functions/v1/activate-card";
const urlParams = new URLSearchParams(window.location.search);

const cardCode = urlParams.get("code");

const CHECK_FUNCTION_URL =
  "https://lbzwmcxwxummitldxucj.supabase.co/functions/v1/check_card";

if (cardCode) {
  document.getElementById("card_code").value = cardCode;
}
async function checkCardStatus() {
  if (!cardCode) return;

  try {
    const response = await fetch(
      CHECK_FUNCTION_URL,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": "sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw",
          "Authorization": "Bearer sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw"
        },
        body: JSON.stringify({
          card_code: cardCode
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(
        result.message || "Gagal mengecek kartu."
      );
    }

    if (result.status === "active") {
      window.location.href =
        result.google_review_url;
      return;
    }

  } catch (error) {
    console.error(error);
  }
}

checkCardStatus();
document
  .getElementById("activationForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const button =
      document.getElementById("submitButton");

    const message =
      document.getElementById("message");

    const reviewButton =
      document.getElementById("reviewButton");

    button.disabled = true;
    button.innerText = "Mengaktifkan...";

    message.style.display = "none";
    reviewButton.style.display = "none";


    const data = {

      card_code:
        document.getElementById("card_code")
        .value
        .trim(),

      business_name:
        document.getElementById("business_name")
        .value
        .trim(),

      owner_name:
        document.getElementById("owner_name")
        .value
        .trim(),

      whatsapp:
        document.getElementById("whatsapp")
        .value
        .trim(),

      google_review_url:
        document.getElementById("google_review_url")
        .value
        .trim()

    };


    try {

      const response = await fetch(
        FUNCTION_URL,
        {
          method: "POST",

         headers: {
  "Content-Type": "application/json",
  "apikey": "sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw",
  "Authorization": "Bearer sb_publishable_uADO7eqVkcwnhY5B0IZrSA_h6p9VRaw"
},

          body: JSON.stringify(data)
        }
      );


      const result =
        await response.json();


      if (!response.ok || !result.success) {

        throw new Error(
          result.message ||
          "Aktivasi gagal."
        );

      }


      message.className = "success";

      message.style.display = "block";

      message.innerText =
        "✅ Kartu berhasil diaktifkan!";


      reviewButton.href =
        result.google_review_url;

      reviewButton.style.display =
        "block";


      document
        .getElementById("activationForm")
        .reset();


    } catch (error) {

      message.className = "error";

      message.style.display = "block";

      message.innerText =
        "❌ " + error.message;

    }


    button.disabled = false;

    button.innerText =
      "Aktifkan Kartu";

  });

</script>

</body>
</html>
