<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>ALJAVA — Task Management</title><link rel="stylesheet" href="/assets/business-hub.css"></head><body><main class="page"><header class="topbar"><div><div class="eyebrow">ALJAVA TERIONITY</div><h1>Task Management</h1><p>Kelola pekerjaan project berdasarkan unit bisnis aktif.</p></div><div class="top-actions"><select id="unit" class="btn secondary"><option>Memuat...</option></select><a class="btn secondary" href="/management-control.html">Control Center</a><a class="btn secondary" href="/erp-core.html">ERP Core</a></div></header><section id="notice" class="notice" hidden></section><section class="card section-card"><div class="section-head"><div><h2>Tambah Task</h2><p>Assign pekerjaan, deadline, prioritas, dan status.</p></div></div><div class="erp-form-grid"><select id="project" class="field"><option value="">Project (opsional)</option></select><input id="title" class="field" placeholder="Judul task" maxlength="180"><select id="status" class="field"><option value="todo">Todo</option><option value="in_progress">In Progress</option><option value="blocked">Blocked</option><option value="done">Done</option><option value="cancelled">Cancelled</option></select><select id="priority" class="field"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select><input id="assignee" class="field" placeholder="User ID assignee (UUID)"><input id="due" class="field" type="date"><textarea id="description" class="field full" rows="2" placeholder="Deskripsi"></textarea><div class="erp-actions full"><button id="save" class="btn" type="button">Simpan Task</button></div></div></section><section class="card section-card"><div class="section-head"><div><h2>Task Board</h2><p id="meta">Memuat...</p></div><button id="refresh" class="btn secondary">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Task</th><th>Project</th><th>Status</th><th>Prioritas</th><th>Assignee</th><th>Deadline</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="muted">Memuat...</td></tr></tbody></table></div></section><footer>ALJAVA TERIONITY • Task Management</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/app-config.js"></script><script>(()=>{'use strict';const sb=window.__ALJAVA_SUPABASE_CLIENT,ctx=window.ALJAVA_BUSINESS_CONTEXT,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));let unit=null,projects=[],tasks=[];const notice=(t,type='info')=>{const e=$('notice');e.hidden=!t;e.className='notice '+type;e.textContent=t};async function init(){const {data:{user},error}=await sb.auth.getUser();if(error||!user){location.href='/login.html';return}const r=await ctx.load();unit=r.active;const units=r.units||[];$('unit').innerHTML=units.map(u=>`<option value="${esc(u.id)}">${esc(u.name)} • ${esc(u.role||'')}</option>`).join('')||'<option value="">Tidak ada akses</option>';if(unit)$('unit').value=unit.id;bind();await load()}async function load(){if(!unit)return;notice('Memuat task...');const [p,t]=await Promise.all([sb.from('projects').select('id,name,code').eq('business_unit_id',unit.id).order('name'),sb.from('project_tasks').select('id,project_id,title,status,priority,assignee_id,due_date,description,created_at').eq('business_unit_id',unit.id).order('due_date',{ascending:true,nullsFirst:false})]);if(p.error||t.error){notice((p.error||t.error).message,'err');return}projects=p.data||[];tasks=t.data||[];$('project').innerHTML='<option value="">Project (opsional)</option>'+projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}${p.code?' • '+esc(p.code):''}</option>`).join('');$('meta').textContent=`${unit.name} • ${tasks.length} task`;$('rows').innerHTML=tasks.map(x=>{const p=projects.find(y=>String(y.id)===String(x.project_id));return `<tr><td><strong>${esc(x.title)}</strong><div class="muted">${esc(x.description||'')}</div></td><td>${esc(p?.name||'-')}</td><td><select class="task-status field" data-id="${esc(x.id)}"><option value="todo" ${x.status==='todo'?'selected':''}>Todo</option><option value="in_progress" ${x.status==='in_progress'?'selected':''}>In Progress</option><option value="blocked" ${x.status==='blocked'?'selected':''}>Blocked</option><option value="done" ${x.status==='done'?'selected':''}>Done</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>Cancelled</option></select></td><td>${esc(x.priority)}</td><td>${esc(x.assignee_id||'-')}</td><td>${esc(x.due_date||'-')}</td><td><button class="btn danger del" data-id="${esc(x.id)}">Hapus</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Belum ada task.</td></tr>';document.querySelectorAll('.task-status').forEach(e=>e.onchange=()=>updateStatus(e.dataset.id,e.value));document.querySelectorAll('.del').forEach(e=>e.onclick=()=>del(e.dataset.id));notice('Task aktif: '+unit.name,'ok')}async function save(){const title=$('title').value.trim();if(!title){notice('Judul task wajib diisi.','err');return}const {data:{user}}=await sb.auth.getUser();const payload={business_unit_id:unit.id,project_id:$('project').value||null,title,status:$('status').value,priority:$('priority').value,assignee_id:$('assignee').value.trim()||null,due_date:$('due').value||null,description:$('description').value.trim()||null,created_by:user?.id||null};const {error}=await sb.from('project_tasks').insert(payload);if(error){notice(error.message,'err');return}$('title').value='';$('assignee').value='';$('due').value='';$('description').value='';await load()}async function updateStatus(id,status){const {error}=await sb.from('project_tasks').update({status,updated_at:new Date().toISOString()}).eq('id',id).eq('business_unit_id',unit.id);if(error)notice(error.message,'err');else notice('Status task diperbarui.','ok')}async function del(id){if(!confirm('Hapus task ini?'))return;const {error}=await sb.from('project_tasks').delete().eq('id',id).eq('business_unit_id',unit.id);if(error)notice(error.message,'err');else await load()}function bind(){$('save').onclick=save;$('refresh').onclick=load;$('unit').onchange=async()=>{const r=await ctx.load();unit=(r.units||[]).find(x=>String(x.id)===String($('unit').value));if(unit){ctx.set(unit.id);await load()}};window.addEventListener('aljava:business-changed',e=>{if(e.detail?.businessUnit){unit=e.detail.businessUnit;load()}})}init().catch(e=>notice(e.message,'err'))})()</script></body></html>
