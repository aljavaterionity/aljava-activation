<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>ALJAVA — Activity Control</title><link rel="stylesheet" href="/assets/business-hub.css"></head><body><main class="page"><header class="topbar"><div><div class="eyebrow">ALJAVA TERIONITY</div><h1>Activity Control</h1><p>Jejak aktivitas operasional berdasarkan unit bisnis aktif.</p></div><div class="top-actions"><select id="unit" class="btn secondary"></select><a class="btn secondary" href="/management-control.html">Control Center</a><a class="btn secondary" href="/customer-pipeline.html">Pipeline</a></div></header><section id="notice" class="notice" hidden></section><section class="card section-card"><div class="section-head"><div><h2>Aktivitas Terbaru</h2><p id="meta">Memuat...</p></div><button id="refresh" class="btn secondary">Refresh</button></div><div id="table" class="table-wrap"></div></section><footer>ALJAVA TERIONITY • Activity Control</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/app-config.js"></script><script src="/assets/business-context.js"></script><script>(()=>{'use strict';const sb=window.__ALJAVA_SUPABASE_CLIENT,$=id=>document.getElementById(id);let units=[],active=null;const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const notice=(t,c='info')=>{const e=$('notice');e.hidden=!t;e.className='notice '+c;e.textContent=t};async function load(){const {data:{user},error}=await sb.auth.getUser();if(error||!user){location.href='/login.html';return}const ctx=await window.ALJAVA_BUSINESS_CONTEXT.load();units=ctx.units||[];active=ctx.active;if(!active){notice('Tidak ada unit bisnis aktif.','err');return}$('unit').innerHTML=units.map(u=>`<option value="${esc(u.id)}">${esc(u.name)} • ${esc(u.role||'')}</option>`).join('');$('unit').value=active.id;await render()}async function render(){if(!active)return;notice('Memuat aktivitas...');const r=await sb.from('business_activity_logs').select('id,module,action,entity_type,entity_id,metadata,created_at').eq('business_unit_id',active.id).order('created_at',{ascending:false}).limit(100);if(r.error){notice('Aktivitas gagal dimuat: '+r.error.message,'err');return}$('meta').textContent=`${active.name} • ${r.data?.length||0} aktivitas terbaru`;$('table').innerHTML=`<table><thead><tr><th>Waktu</th><th>Modul</th><th>Aksi</th><th>Entity</th><th>Detail</th></tr></thead><tbody>${(r.data||[]).map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('id-ID'))}</td><td>${esc(x.module)}</td><td>${esc(x.action)}</td><td>${esc(x.entity_type||'-')}<br><small>${esc(x.entity_id||'')}</small></td><td><code>${esc(JSON.stringify(x.metadata||{}))}</code></td></tr>`).join('')||'<tr><td colspan="5">Belum ada aktivitas.</td></tr>'}</tbody></table>`;notice('Activity Control diperbarui.','ok')}$('unit').onchange=async()=>{const u=units.find(x=>x.id===$('unit').value);if(u){active=u;await window.ALJAVA_BUSINESS_CONTEXT.set(u.id);render()}};$('refresh').onclick=render;window.addEventListener('aljava:business-changed',e=>{active=e.detail.businessUnit;render()});load().catch(e=>notice(e.message,'err'))})()</script></body></html>
