<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALJAVA TERIONITY - Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#effcff;font-family:Inter,Poppins,Arial,sans-serif}
#adminFrame{width:100%;height:100%;border:0;display:block}
#menuToggle{position:fixed;left:18px;top:18px;z-index:2147483647;width:48px;height:48px;display:none;place-items:center;padding:0;border:1px solid rgba(39,163,211,.35);border-radius:12px;background:rgba(255,255,255,.96);color:#0879b8;box-shadow:0 12px 30px rgba(38,139,177,.18);cursor:pointer;font-size:25px;font-weight:900;line-height:1;touch-action:manipulation}
#menuToggle.show{display:grid}
#menuDrawer{position:fixed;left:18px;top:76px;z-index:2147483646;width:290px;display:none;padding:16px;border:1px solid rgba(55,180,225,.3);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(220,247,255,.94));box-shadow:0 24px 70px rgba(38,139,177,.28)}
#menuDrawer.open{display:block}
#menuDrawer h2{margin:0 0 4px;color:#0879b8;font-size:20px}#menuDrawer p{margin:0 0 14px;color:#58788f;font-size:12px}
.menuBtn{width:100%;min-height:48px;margin-top:9px;padding:11px 13px;border:1px solid rgba(39,163,211,.28);border-radius:11px;background:rgba(255,255,255,.78);color:#17324d;text-align:left;font-weight:800;cursor:pointer}
.menuBtn:hover{border-color:#35c9f2;background:#fff;transform:translateY(-1px)}.menuBtn.danger{border-color:rgba(190,65,90,.32);background:rgba(255,225,232,.8);color:#9b3047}
@media(max-width:520px){#menuToggle{left:12px;top:12px}#menuDrawer{left:12px;right:12px;top:72px;width:auto}}
</style>
</head>
<body>
<iframe id="adminFrame" src="/admin-source.html" title="ALJAVA TERIONITY Admin"></iframe>
<button id="menuToggle" type="button" aria-label="Buka Main Menu" aria-expanded="false">☰</button>
<aside id="menuDrawer" aria-hidden="true">
  <h2>Main Menu</h2>
  <p>Pengaturan dan akses cepat admin.</p>
  <button class="menuBtn" id="resetBtn" type="button">↻ Reset Dashboard</button>
  <button class="menuBtn" id="addBtn" type="button">＋ Tambah Akun</button>
  <button class="menuBtn" id="customerBtn" type="button">👥 Database Customer</button>
  <button class="menuBtn danger" id="logoutBtn" type="button">⇥ Logout</button>
</aside>
<script>
(()=>{
  const frame=document.getElementById('adminFrame');
  const toggle=document.getElementById('menuToggle');
  const drawer=document.getElementById('menuDrawer');
  const close=()=>{drawer.classList.remove('open');toggle.setAttribute('aria-expanded','false');drawer.setAttribute('aria-hidden','true')};
  const open=()=>{drawer.classList.add('open');toggle.setAttribute('aria-expanded','true');drawer.setAttribute('aria-hidden','false')};
  toggle.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();drawer.classList.contains('open')?close():open()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  function inside(){try{return frame.contentDocument||frame.contentWindow.document}catch{return null}}
  function cleanLegacy(){
    const d=inside(); if(!d)return false;
    const app=d.getElementById('app'), login=d.getElementById('login');
    const logged=!!app && getComputedStyle(app).display!=='none' && (!login || getComputedStyle(login).display==='none');
    toggle.classList.toggle('show',logged);
    ['adminMenuToggle','adminMenuBackdrop'].forEach(id=>d.getElementById(id)?.remove());
    d.querySelectorAll('.admin-menu').forEach(el=>{el.style.display='none';el.style.pointerEvents='none';el.style.filter='none';el.style.backdropFilter='none'});
    if(d.body) d.body.style.overflow='auto';
    return logged;
  }
  frame.addEventListener('load',()=>{setTimeout(cleanLegacy,50);setTimeout(cleanLegacy,300);setTimeout(cleanLegacy,800)});
  setInterval(cleanLegacy,600);
  const clickInside=id=>{const d=inside();const el=d?.getElementById(id);el?.click();return !!el};
  document.getElementById('resetBtn').onclick=()=>{close();clickInside('adminReset')||clickInside('refresh')};
  document.getElementById('addBtn').onclick=()=>{close();clickInside('adminAddAccount')};
  document.getElementById('customerBtn').onclick=()=>{close();const d=inside();const el=d?.getElementById('customerDatabase');if(el){el.scrollIntoView({behavior:'smooth',block:'start'})}};
  document.getElementById('logoutBtn').onclick=()=>{close();clickInside('logout')};
})();
</script>
</body>
</html>
